<script>
// Apply the saved header colour immediately so reloads don't flash the default blue.
try {
  var v = JSON.parse(localStorage.getItem("posterPaletteVars") || "null");
  if (v && v.length === 4) {
    var r = document.documentElement.style;
    r.setProperty("--poster-header-day", v[0]);
    r.setProperty("--poster-header-day-ink", v[1]);
    r.setProperty("--poster-header-night", v[2]);
    r.setProperty("--poster-header-night-ink", v[3]);
  }
} catch (e) {}
</script>
<style>
/* POSTER · WHITE + COLOR STUDY
   Full replacement for the original <style> block (or the previous Poster CSS).
   White light-mode body; original dark body; original typography and layout.
   Default: electric blue in light mode, ice blue in dark mode.

   Color choices on <html>:
     data-palette="blue" | "violet" | "orange" | "teal" | "blue-peach"
   Header behavior:
     data-header-mode="adaptive" (default) or "fixed" (same color in both modes)
   Appearance:
     data-theme="light" | "dark"; omit to follow the device.

   Example: <html data-palette="blue-peach" data-header-mode="adaptive">
   Keep your existing assignment/upload JavaScript. No new backend required.
*/
@import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap");
:root {
  --poster-bg:#ffffff;
  --poster-card-bg:#ffffff;
  --poster-text:#171914;
  --poster-text-soft:#616161;
  --poster-border:#171914;
  --poster-ui-accent:var(--poster-header-fill);
  --poster-on-accent:var(--poster-header-ink);
  --poster-accent-soft:#f2f2f2;
  --poster-track:#e9e9e9;
  --poster-done:#255938;
  --poster-done-bg:#e1edce;
  --poster-turned:#245b76;
  --poster-turned-bg:#dcecf3;
  --poster-danger:#ad302a;
  --poster-scrim:#12140f77;
  --poster-sans:"Space Grotesk", "Arial", sans-serif;
  --poster-display:"Barlow Condensed", Impact, "Arial Narrow", sans-serif;
  --poster-mono:ui-monospace, "SFMono-Regular", monospace;
}

/* Complete replacement for the original <style> block. No markup changes required.
   Class colours stay in the existing JavaScript; the theme controls app chrome.
   Explicit theme: <html data-theme="light"> or <html data-theme="dark">.
   With no data-theme, follows the device. */
:root {
  --poster-space-1:4px; --poster-space-2:8px; --poster-space-3:12px; --poster-space-4:16px;
  --poster-space-5:24px; --poster-space-6:32px; --poster-space-7:48px; --poster-space-8:64px;
  --poster-radius:10px; --poster-control-radius:8px; --poster-shadow:none;
  color-scheme:light;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body {
  margin:0; padding:0 0 max(40px,env(safe-area-inset-bottom));
  background:var(--poster-bg); color:var(--poster-text); font:400 16px/1.5 var(--poster-sans);
  -webkit-font-smoothing:antialiased; overflow-wrap:anywhere;
}
button,input,textarea { font:inherit; }
button { cursor:pointer; touch-action:manipulation; }
button,textarea,input { -webkit-tap-highlight-color:transparent; }
button:focus-visible,input:focus-visible,textarea:focus-visible,[role="button"]:focus-visible {
  outline:3px solid var(--poster-ui-accent); outline-offset:4px;
}
button:disabled { opacity:.55; cursor:wait; }
[hidden] { display:none !important; }
.topbar {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:relative;
  padding:calc(24px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));
  background:var(--poster-card-bg); border-bottom:1px solid var(--poster-border);
}
.topbar > div:not(.topbar-badge) { flex:1 1 180px; min-width:0; }
.topbar-badge { flex:0 0 28px; width:28px; height:28px; background:var(--poster-ui-accent); border-radius:var(--poster-control-radius); }
.topbar h1 { margin:0; color:var(--poster-text); font:600 clamp(24px,4vw,40px)/1.04 var(--poster-display); letter-spacing:-.035em; overflow-wrap:normal; }
.topbar .sub { margin-top:8px; color:var(--poster-text-soft); font-size:13px; }
.upload-btn {
  min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 16px; margin-left:auto; border:1px solid transparent;
  border-radius:var(--poster-control-radius); background:var(--poster-ui-accent); color:var(--poster-on-accent);
  font:600 14px/1.3 var(--poster-sans); flex-shrink:0;
}

.customize-wrap { position:absolute; top:16px; right:max(16px,env(safe-area-inset-right)); z-index:1050; }

.customize-panel {

  position:absolute; top:calc(100% + 8px); right:0; z-index:1100;
  width:280px; max-width:calc(100vw - 32px);
  background:var(--poster-card-bg); border:1px solid var(--poster-border); box-shadow:var(--poster-shadow);
  border-radius:var(--poster-radius); padding:16px; color:var(--poster-text);

.customize-panel.open { display:block; }
.customize-title { font:700 20px/1 var(--poster-display); text-transform:uppercase; color:var(--poster-text); margin-bottom:14px; }
.customize-section-label { font:600 11px/1.4 var(--poster-mono); text-transform:uppercase; color:var(--poster-text-soft); margin:14px 0 8px; }
.customize-section-label:first-of-type { margin-top:0; }
.palette-swatches { display:flex; flex-wrap:wrap; gap:8px; }

  cursor:pointer; flex-shrink:0; position:relative;
}
.palette-swatch.selected::after {

.class-color-list { display:flex; flex-direction:column; gap:8px; }
.class-color-row { display:flex; align-items:center; gap:10px; }
.class-color-row .ccr-name {

}

@media (hover:hover) { .ccr-delete:not(.confirm):hover { color:#D92D20; border-color:#D92D20; } }

/* ---- Sync section in the Customize panel ---- */
.sync-code { font:500 22px/1.1 var(--poster-mono); letter-spacing:.06em; color:var(--poster-text); }
.sync-status { margin-top:4px; font-size:12px; color:var(--poster-text-soft); }

  border-radius:var(--poster-control-radius); background:var(--poster-bg); color:var(--poster-text);
  font:500 14px/1.2 var(--poster-mono); text-transform:uppercase;
}
.sync-join button {
  min-height:40px; padding:8px 12px; border:1px solid var(--poster-border);
  border-radius:var(--poster-control-radius); background:var(--poster-text); color:var(--poster-bg);
  font:500 12px/1.2 var(--poster-sans); text-transform:uppercase;
}
.sync-hint { margin-top:8px; font-size:11px; line-height:1.4; color:var(--poster-text-soft); }

.wrap { width:100%; max-width:1000px; margin:0 auto; padding:24px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left)); }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 20px; }
.filter-btn {
  display:inline-flex; align-items:center; gap:7px; min-height:44px;
  padding:9px 12px; border:1px solid var(--poster-border); border-radius:var(--poster-control-radius);
  background:var(--poster-card-bg); color:var(--poster-text-soft); font:600 13px/1.25 var(--poster-sans); max-width:100%; text-align:left;
}
.filter-btn .dot { width:8px; height:8px; border-radius:50%; flex:0 0 8px; }
/* Existing renderer sets active backgrounds inline. A neutral selection keeps

.filter-btn.active { background:var(--poster-text) !important; color:var(--poster-bg); border-color:var(--poster-text); }
.filter-btn[data-f="All"] .dot { display:none; }
.progress-wrap { padding:16px; margin-bottom:28px; border:1px solid var(--poster-border); border-radius:var(--poster-radius); background:var(--poster-card-bg); }
.progress-label { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; color:var(--poster-text-soft); font-size:13px; }
.progress-label b { color:var(--poster-text); font-weight:600; font-variant-numeric:tabular-nums; }
.progress-track { height:7px; border:0; border-radius:20px; overflow:hidden; background:var(--poster-track); }
.progress-fill { height:100%; border:0; border-radius:inherit; background:var(--poster-ui-accent); transition:width .2s ease; }
.timeline { position:relative; min-width:0; }
.date-row,.today-marker-row { display:flex; gap:12px; }
.date-rail,.today-marker-rail { width:12px; flex:0 0 12px; display:flex; flex-direction:column; align-items:center; }
.date-node { flex:0 0 9px; width:9px; height:9px; margin-top:9px; border:2px solid var(--poster-bg); border-radius:50%; background:var(--poster-ui-accent); }
.date-line,.today-marker-line { width:1px; flex:1; margin-top:8px; background:var(--poster-border); }
.date-row:last-child .date-line { background:transparent; }
.date-content { flex:1; min-width:0; padding-bottom:24px; }
.date-heading { margin:0 0 12px; font:600 14px/1.6 var(--poster-sans); color:var(--poster-text); }
.card {
  min-width:0; margin:0 0 10px; padding:16px; cursor:pointer;
  border:1px solid var(--poster-border); border-left:3px solid var(--accent,var(--poster-ui-accent));
  border-radius:var(--poster-radius); background:var(--poster-card-bg); box-shadow:var(--poster-shadow);
}
.card-top { display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
.card-left { flex:1; min-width:0; }
/* An opaque label backing leaves a 4px stripe of the ORIGINAL inline class

.tag {
  display:inline-flex; align-items:center; position:relative; isolation:isolate;
  color:var(--poster-text); border:1px solid var(--poster-border); border-left:0;
  border-radius:3px; padding:3px 7px 3px 11px; margin-bottom:8px;
  font:600 11px/1.3 var(--poster-sans); max-width:100%; overflow-wrap:anywhere;
}
.tag::before { content:""; position:absolute; z-index:-1; inset:0 0 0 4px; background:var(--poster-card-bg); border-radius:0 2px 2px 0; }
.title { font:600 17px/1.3 var(--poster-sans); color:var(--poster-text); letter-spacing:-.018em; }
.time { color:var(--poster-text-soft); margin-top:6px; font-size:12px; }

.pill.on.complete { color:var(--poster-done); background:var(--poster-done-bg); border-color:transparent; }
.pill.on.turned { color:var(--poster-turned); background:var(--poster-turned-bg); border-color:transparent; }
.details { display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--poster-border); font-size:14px; line-height:1.6; color:var(--poster-text-soft); }

.action-btn { flex:1 1 130px; min-height:44px; border:1px solid var(--poster-border); border-radius:var(--poster-control-radius); padding:10px; background:var(--poster-card-bg); color:var(--poster-text); font:600 13px/1.3 var(--poster-sans); }

.action-btn.turned.on { color:var(--poster-turned); background:var(--poster-turned-bg); border-color:var(--poster-turned); }
.date-node.is-today { width:12px; height:12px; flex-basis:12px; background:var(--poster-ui-accent); box-shadow:0 0 0 2px var(--poster-ui-accent); animation:none; }
.today-chip { display:inline-block; margin-left:8px; padding:3px 8px; border-radius:var(--poster-control-radius); background:var(--poster-ui-accent); color:var(--poster-on-accent); font:600 11px/1.3 var(--poster-sans); vertical-align:middle; }
.today-marker-node { width:12px; height:12px; flex:0 0 12px; margin-top:5px; border-radius:50%; background:var(--poster-ui-accent); animation:none; }
.today-marker-content { flex:1; min-width:0; padding:0 0 24px; }
.today-marker-label { display:flex; align-items:center; gap:12px; width:100%; color:var(--poster-text); font:600 13px/1.5 var(--poster-sans); }
.today-marker-label::after { content:""; flex:1; min-width:12px; height:1px; background:var(--poster-ui-accent); }
canvas#confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:999; }
.modal-overlay { display:none; position:fixed; inset:0; z-index:1000; align-items:center; justify-content:center; padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); background:var(--poster-scrim); }
.modal-overlay.open { display:flex; }
.modal { width:100%; max-width:560px; max-height:85vh; max-height:85dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--poster-card-bg); border:1px solid var(--poster-border); color:var(--poster-text); padding:24px; border-radius:var(--poster-radius); box-shadow:var(--poster-shadow); }

.modal-btn.primary { background:var(--poster-ui-accent); color:var(--poster-on-accent); border-color:transparent; }

.dropzone { width:100%; border:1px dashed var(--poster-text-soft); border-radius:var(--poster-control-radius); padding:24px 16px; text-align:center; background:var(--poster-bg); color:var(--poster-text); cursor:pointer; }

/* The deadline is the poster: square corners, oversized type, deliberate hard edges. */
:root { --poster-radius:0px; --poster-control-radius:0px; --poster-shadow:4px 4px 0 var(--poster-border); }
.topbar { align-items:flex-end; background:var(--poster-ui-accent); color:var(--poster-on-accent); border-bottom:3px solid var(--poster-border); gap:16px; padding-top:calc(24px + env(safe-area-inset-top)); }
.topbar-badge { display:none; }
.topbar h1 { color:var(--poster-on-accent); font:800 56px/.88 var(--poster-display); text-transform:uppercase; max-width:12ch; letter-spacing:-.015em; }
.topbar .sub { color:var(--poster-on-accent); font:500 11px/1.4 var(--poster-mono); text-transform:uppercase; }
.upload-btn { background:var(--poster-on-accent); color:var(--poster-ui-accent); border:2px solid var(--poster-on-accent); box-shadow:none; font-weight:700; }
.wrap { max-width:1240px; padding-top:24px; }
.filters { gap:8px; }
.filter-btn { border-width:2px; font-size:12px; font-weight:700; text-transform:uppercase; }
.filter-btn.active { box-shadow:3px 3px 0 var(--poster-border); }
.filter-btn .dot { border-radius:0; }
.progress-wrap { border:0; border-bottom:3px solid var(--poster-border); padding:0 0 18px; border-radius:0; background:transparent; margin-bottom:24px; }
.progress-label { font:500 12px/1.4 var(--poster-mono); text-transform:uppercase; }
.progress-label b { font:800 38px/.9 var(--poster-display); }
.progress-track { height:12px; border-radius:0; }
.progress-fill { background:var(--poster-text); }
.date-rail,.today-marker-rail { display:none; }
.date-heading { font:700 29px/1 var(--poster-display); text-transform:uppercase; border-top:3px solid var(--poster-border); padding-top:10px; margin-bottom:16px; }
.date-content { padding-bottom:24px; }
.card { border:2px solid var(--poster-border); box-shadow:var(--poster-shadow); padding:16px; margin:0 4px 18px 0; }
.tag { border-color:var(--poster-border); border-radius:0; font:600 11px/1.25 var(--poster-mono); text-transform:uppercase; }
.tag::before { border-radius:0; }
.title { font:700 29px/.98 var(--poster-display); text-transform:uppercase; letter-spacing:.005em; }
.time { font:400 11px/1.5 var(--poster-mono); }
.pill { border-radius:0; font:400 11px/1.3 var(--poster-mono); }
.today-marker-label { font:700 17px/1.3 var(--poster-sans); text-transform:uppercase; }
.today-marker-label::after { height:3px; background:var(--poster-text); }
.action-btn { border-width:2px; font:600 12px/1.2 var(--poster-sans); text-transform:uppercase; }
.today-chip { background:var(--poster-text); color:var(--poster-bg); }
.completed-section { padding-left:0; }
.completed-toggle { border-top-width:3px; text-transform:uppercase; font-size:13px; }
.modal h2 { font:700 36px/1 var(--poster-display); text-transform:uppercase; }
@media (min-width:900px) {
  .topbar { padding:40px max(32px,calc((100% - 1176px)/2)) 32px; }
  .topbar h1 { font-size:96px; max-width:12ch; }
  .topbar .sub { font-size:12px; }
  .wrap { padding-top:32px; }
  .date-heading { font-size:38px; }
  .card { padding:24px; }
  .title { font-size:40px; }
}
@media (max-width:380px) {
  .topbar h1 { font-size:44px; }
}


/* Header color is independent of assignment class colors. */
:root {
  --poster-header-day:#2459F6;
  --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#A2BEFF;
  --poster-header-night-ink:#171914;
  --poster-header-fill:var(--poster-header-day);
  --poster-header-ink:var(--poster-header-day-ink);
}
:root[data-palette="blue"] {
  --poster-header-day:#2459F6; --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#A2BEFF; --poster-header-night-ink:#171914;
}
:root[data-palette="violet"] {
  --poster-header-day:#7447DB; --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#C1A3FF; --poster-header-night-ink:#171914;
}
:root[data-palette="orange"] {
  --poster-header-day:#FF822E; --poster-header-day-ink:#171914;
  --poster-header-night:#FFB98A; --poster-header-night-ink:#171914;
}
:root[data-palette="teal"] {
  --poster-header-day:#08766B; --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#79DAC6; --poster-header-night-ink:#171914;
}
:root[data-palette="blue-peach"] {
  --poster-header-day:#2347A4; --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#FFAC77; --poster-header-night-ink:#171914;
}

:root[data-theme="dark"] {
  --poster-header-fill:var(--poster-header-night);
  --poster-header-ink:var(--poster-header-night-ink);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --poster-header-fill:var(--poster-header-night);
    --poster-header-ink:var(--poster-header-night-ink);
  }
}
/* This override comes last, so it also covers explicit and system dark mode. */
:root[data-header-mode="fixed"] {
  --poster-header-fill:var(--poster-header-day);
  --poster-header-ink:var(--poster-header-day-ink);
}

/* Explicit light mode wins over device and containing-app appearance. */
:root[data-theme="light"] {
  color-scheme:only light;
  --poster-bg:#ffffff;
  --poster-card-bg:#ffffff;
  --poster-text:#171914;
  --poster-text-soft:#616161;
  --poster-border:#171914;
  --poster-track:#e9e9e9;
  --poster-accent-soft:#f2f2f2;
  --poster-header-fill:var(--poster-header-day);
  --poster-header-ink:var(--poster-header-day-ink);
}
:root[data-theme="light"] body {
  color-scheme:only light;
  background-color:#ffffff !important;
  color:#171914;
}
:root[data-theme="light"] .wrap,
:root[data-theme="light"] .timeline,
:root[data-theme="light"] .date-content,
:root[data-theme="light"] .card,
:root[data-theme="light"] .completed-section,
:root[data-theme="light"] .completed-list,
:root[data-theme="light"] .modal {
  background-color:#ffffff;
}
/* ---- To Do / Done pages (poster style) ---- */
.view-tabs { display:flex; gap:0; margin:0 0 20px; border:3px solid var(--poster-border); border-radius:var(--poster-radius); overflow:hidden; }
.view-tab {
  flex:1; min-height:48px; border:0; background:var(--poster-card-bg); color:var(--poster-text);
  font:700 22px/1 var(--poster-display); text-transform:uppercase; letter-spacing:.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
}
.view-tab + .view-tab { border-left:3px solid var(--poster-border); }
.view-tab.active { background:var(--poster-ui-accent); color:var(--poster-on-accent); }
.view-tab .count { font:600 11px/1 var(--poster-mono); padding:4px 7px; border:2px solid currentColor; border-radius:20px; }
.done-view .card { opacity:.8; }

/* ---- Lighter type ---- */
.topbar h1, .date-heading, .title, .view-tab, .empty-state-title, .customize-title { font-weight:500; }
.upload-btn, .filter-btn, .action-btn, .modal-btn, .today-chip, .today-marker-label,
.completed-toggle, .undo-btn, .progress-label b { font-weight:500; }
.tag { font-weight:500; }
.pill.on.complete, .pill.on.turned { font-weight:500; }

/* ---- Past due ---- */
:root { --poster-overdue:#D92D20; --poster-overdue-ink:#FFFFFF; }
.card.overdue { border-color:var(--poster-overdue); box-shadow:4px 4px 0 var(--poster-overdue); }
.pill.overdue {
  order:-1; color:var(--poster-overdue-ink); background:var(--poster-overdue);
  border-color:var(--poster-overdue); font-weight:600; text-transform:uppercase; letter-spacing:.04em;
}

/* ---- Bigger "Today" ---- */
.today-chip {
  margin-left:12px; padding:5px 12px 4px; vertical-align:.18em;
  font:500 20px/1 var(--poster-display); text-transform:uppercase; letter-spacing:.02em;
}
.today-marker-label { font:500 26px/1.1 var(--poster-display); }
.date-heading.is-today { font-size:44px; line-height:1; border-top-width:6px; }
@media (min-width:900px) {
  .date-heading.is-today { font-size:96px; line-height:.95; border-top-width:8px; padding-top:14px; }
  .today-chip { font-size:40px; padding:8px 18px 6px; margin-left:18px; }
  .today-marker-label { font-size:52px; }
}

/* ---- site nav (Homework / Schedule / Notebook) ---- */
.site-nav {
  display:flex; gap:14px; background:var(--poster-bg);
  padding:calc(20px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 22px max(16px,env(safe-area-inset-left));
}
/* Sticker buttons: each its own pastel, tilted a little; the current page straightens and takes the header color */
.nav-link {
  flex:1 1 0; min-width:0; min-height:48px; display:flex; align-items:center; justify-content:center;
  padding:10px 8px; border:3px solid var(--poster-border); border-radius:6px;
  color:#171914; text-decoration:none; box-shadow:5px 5px 0 var(--poster-border);
  transition:transform .12s, box-shadow .12s;
  font:800 21px/1 var(--poster-display); text-transform:uppercase; letter-spacing:.02em;
}
.nav-link[data-page="homework"] { background:#FF7849; transform:rotate(-2.5deg); }
.nav-link[data-page="schedule"] { background:#B6E35A; transform:rotate(1.8deg); }
.nav-link[data-page="notebook"] { background:#C9B6FF; transform:rotate(-1.4deg); }
.nav-link:hover { transform:rotate(0) translate(-1px,-2px); box-shadow:6px 7px 0 var(--poster-border); }
.nav-link:active { transform:rotate(0) translate(3px,3px); box-shadow:1px 1px 0 var(--poster-border); }
.nav-link[aria-current="page"] { transform:rotate(0) scale(1.04); background:var(--poster-ui-accent); color:var(--poster-on-accent); }
.nav-link:focus-visible { outline:3px solid var(--poster-ui-accent); outline-offset:4px; }
@media (min-width:900px) {
  .site-nav { padding-left:max(32px,calc((100% - 1176px)/2)); padding-right:max(32px,calc((100% - 1176px)/2)); }
  .nav-link { font-size:26px; }
  .nav-link[data-page="homework"] { transform:rotate(-1deg); }
  .nav-link[data-page="schedule"] { transform:rotate(.8deg); }
  .nav-link[data-page="notebook"] { transform:rotate(-.6deg); }
  .nav-link[aria-current="page"] { transform:rotate(0) scale(1.02); }
}
@media (max-width:480px) {
  .site-nav { gap:10px; }
  .nav-link { min-height:44px; padding:8px 4px; font-size:17px; white-space:nowrap; border-width:2.5px; box-shadow:4px 4px 0 var(--poster-border); }
}
@media (prefers-reduced-motion:reduce) { .nav-link { transition:none; } }
.site-nav ~ .page .topbar { padding-top:24px; }
.page-soon { max-width:1176px; margin:0 auto; padding:64px max(20px,env(safe-area-inset-left)) 64px max(20px,env(safe-area-inset-right)); }
.page-soon h1 { margin:0 0 12px; font:800 clamp(48px,10vw,96px)/.9 var(--poster-display); text-transform:uppercase; }
.page-soon p { margin:0; color:var(--poster-text-soft); font:500 12px/1.5 var(--poster-mono); text-transform:uppercase; }

/* ================= Schedule page =================
   Week / Month / Day views. Every day is its own box with a gap around it, and
   each view is sized to fit the screen (no page scrolling, no sideways overhang).
   Days outside the shown month are faded. */
#page-schedule {
  --s-gap:10px;
  --s-shadow:4px;
  background:var(--poster-bg); color:var(--poster-text);
}
.sched { max-width:1440px; margin:0 auto; padding:4px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left)); }
@media (min-width:900px) { .sched { padding-left:max(32px,env(safe-area-inset-left)); padding-right:max(32px,env(safe-area-inset-right)); } }

/* ---- toolbar ----
   One slim row: ‹ title › on the left, a small Day/Week/Month switch in the middle,
   Today / Assignments / + Add on the right. Phones get two short rows. */
.sched-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 12px; }
.sb-tools { display:contents; }
.sb-break { display:none; flex-basis:100%; height:0; }
.sb-space, .sb-space2 { flex:1 1 0; min-width:0; }
.sched-title { flex:0 1 auto; min-width:0; margin:0; font:800 clamp(28px,3.4vw,44px)/.9 var(--poster-display); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sched-btn { min-width:36px; min-height:36px; padding:5px 11px; border:2px solid var(--poster-border); background:var(--poster-card-bg); color:var(--poster-text); font:600 15px/1 var(--poster-display); text-transform:uppercase; letter-spacing:.03em; }
.sched-btn:disabled { opacity:.3; cursor:default; }
.sched-btn:not(:disabled):active { transform:translate(1px,1px); }
.sb-arrow { width:36px; padding:0; font-size:18px; }
.sched-bar .sb-arrow { width:28px; min-width:28px; border-color:transparent; background:transparent; font-size:26px; }
.sched-btn.sched-add { background:var(--poster-ui-accent); color:var(--poster-on-accent); box-shadow:3px 3px 0 var(--poster-border); white-space:nowrap; }
.sched-btn.sched-add:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--poster-border); }
.sched-seg { display:flex; border:2px solid var(--poster-border); background:var(--poster-card-bg); }
.sched-seg button { min-height:28px; padding:3px 11px; border:0; background:transparent; color:var(--poster-text); font:600 13px/1 var(--poster-display); text-transform:uppercase; letter-spacing:.04em; }
.sched-seg button + button { border-left:2px solid var(--poster-border); }
.sched-seg button[aria-pressed="true"] { background:var(--poster-ui-accent); color:var(--poster-on-accent); }
/* the assignments switch is a regular square button with a little checkbox */
.sched-toggle { display:inline-flex; align-items:center; gap:7px; min-height:32px; padding:4px 10px; border:2px solid var(--poster-border); background:var(--poster-card-bg); color:var(--poster-text); font:600 13px/1 var(--poster-display); text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.sched-toggle .knob { width:12px; height:12px; border:2px solid var(--poster-border); flex-shrink:0; display:grid; place-items:center; font:900 9px/1 var(--poster-sans); }
.sched-toggle[aria-checked="true"] .knob { background:var(--poster-ui-accent); border-color:var(--poster-ui-accent); color:var(--poster-on-accent); }
.sched-toggle[aria-checked="true"] .knob::after { content:"✓"; }
.sched-toggle .short { display:none; }

.sb-prev { order:1; } .sched-title { order:2; } .sb-next { order:3; } .sb-space { order:4; }
.sched-views { order:5; } .sb-space2 { order:6; } .sb-today { order:7; } .sched-toggle { order:8; } .sched-add { order:9; }
.sched-bar .sb-prev { margin-right:-4px; } .sched-bar .sb-next { margin-left:-4px; }

/* wide screens: the view switch is pinned to the middle, so a longer or shorter title never moves it */
@media (min-width:900px) {
  .sched-bar { position:relative; }
  .sched-views { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  .sched-title { max-width:calc(50% - 190px); }
}
@media (max-width:899px) {
  .sb-break { display:block; order:5; }
  .sched-add { order:4; margin-left:auto; }
  .sb-space, .sb-space2 { display:none; }
  .sched-views { order:6; } .sb-today { order:7; margin-left:auto; } .sched-toggle { order:8; }
}
@media (max-width:520px) {
  .sched-bar { gap:8px; margin-bottom:10px; }
  .sched-title { font-size:26px; }
  .sched-btn { min-height:32px; padding:4px 8px; font-size:14px; }
  .sched-seg button { min-height:28px; padding:3px 9px; font-size:13px; }
  .sched-toggle { min-height:32px; padding:3px 8px; gap:6px; }
  .sched-toggle .long { display:none; }
  .sched-toggle .short { display:inline; }
  .sched-add .long { display:none; }
}

/* the schedule fills the screen, so the page itself never scrolls */
body:has(#page-schedule:not([hidden])) { padding-bottom:0; }
/* the area under the toolbar; its height is set from the window size in JS */
#schedBody { display:flex; flex-direction:column; min-height:0; padding:0 var(--s-shadow) var(--s-shadow) 0; }

/* a day box (shared by all views) */
.sday { min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:8px; padding:10px; background:var(--poster-card-bg); color:var(--poster-text); border:3px solid var(--poster-border); box-shadow:var(--s-shadow) var(--s-shadow) 0 var(--poster-border); text-align:left; font:inherit; }
.sday-head { display:flex; align-items:baseline; justify-content:space-between; gap:6px; flex-shrink:0; }
.sday-dow { font:600 11px/1.3 var(--poster-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--poster-text-soft); }
.sday-num { font:700 26px/1 var(--poster-display); font-variant-numeric:tabular-nums; }
/* days outside the shown month are faded */
.sday.is-out { background:var(--poster-bg); color:var(--poster-text-soft); box-shadow:none; opacity:.55; }
.sday.is-today { background:var(--poster-ui-accent); color:var(--poster-on-accent); }
.sday.is-today .sday-dow { color:var(--poster-on-accent); }
.sday-empty { font:600 11px/1.3 var(--poster-mono); color:var(--poster-text-soft); text-transform:uppercase; }
.sday.is-today .sday-empty { color:var(--poster-on-accent); opacity:.8; }
.smarks { display:flex; flex-direction:column; gap:6px; min-width:0; min-height:0; overflow:hidden; }

/* marker: the same chip will be used for things you add yourself */
.smark { display:flex; align-items:flex-start; gap:7px; width:100%; min-width:0; flex-shrink:0; padding:6px 8px; text-align:left; background:var(--poster-card-bg); color:var(--poster-text); border:1.5px solid var(--poster-border); border-left:5px solid var(--mc); font:500 12.5px/1.25 var(--poster-sans); }
.smark .mt { flex:1; min-width:0; overflow-wrap:break-word; }
.smark .mtime { display:block; margin-top:2px; font:600 10px/1.2 var(--poster-mono); text-transform:uppercase; color:var(--poster-text-soft); }
.smark .mdesc { display:none; }
/* Finished assignments (done AND turned in): every marker has a round checkbox,
   finished ones are filled in with a check and tinted with the class color */
.smark::before { content:""; flex-shrink:0; width:14px; height:14px; margin-top:1px; border-radius:50%; border:2px solid var(--mc); box-sizing:border-box; display:grid; place-items:center; font:900 9px/1 var(--poster-sans); color:#fff; }
.smark.is-done::before { content:"✓"; background:var(--mc); }
.smark.is-done { background:color-mix(in srgb, var(--mc) 16%, var(--poster-card-bg)); }
.smark.is-done .mt { color:var(--poster-text-soft); }
.smark[data-id] { cursor:pointer; }
.smonth .smark[data-id]:hover { filter:none; }
.smark[data-id]:hover { filter:brightness(.96); }
.smark[data-id]:focus-visible { outline:3px solid var(--poster-ui-accent); outline-offset:1px; }
.sdots { display:none; flex-wrap:wrap; gap:3px; }
.sdot { width:8px; height:8px; border-radius:50%; background:var(--mc); border:1.5px solid var(--poster-border); }
.smore { flex-shrink:0; font:600 10px/1.2 var(--poster-mono); text-transform:uppercase; opacity:.8; }

/* week: all 7 days across the screen, filling the height */
.sweek { flex:1; min-height:0; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:var(--s-gap); }
.sweek .sday { cursor:pointer; }
@media (max-width:699px) {
  #page-schedule { --s-gap:5px; --s-shadow:3px; }
  .sweek .sday { padding:6px 4px; gap:6px; border-width:2px; }
  .sweek .sday-head { flex-direction:column; align-items:center; gap:2px; }
  .sweek .sday-dow { font-size:9px; letter-spacing:0; }
  .sweek .sday-num { font-size:20px; }
  .sweek .sday-empty { display:none; }
  .sweek .tlabel { display:none; }
  .sweek .smarks { gap:4px; }
  .sweek .smark { padding:2px 1px 2px 4px; border:0; border-left:3px solid var(--mc); background:transparent; color:inherit; font-size:9px; line-height:1.2; }
  .sweek .smark .mtime { display:none; }
  .sweek .smark .mt { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:normal; word-break:normal; }
  .sweek .smark::before { display:none; }
  .sweek .smark.is-done { background:color-mix(in srgb, var(--mc) 22%, transparent); }
}

/* month: the whole month fits; rows share the height */
.smonth-dows { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:var(--s-gap); margin-bottom:6px; flex-shrink:0; }
.smonth-dows span { font:600 11px/1.3 var(--poster-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--poster-text-soft); padding-left:4px; }
.smonth { flex:1; min-height:0; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:var(--s-gap); }
.smonth .sday { padding:5px 7px; gap:3px; cursor:pointer; }
.smonth .smarks { flex:1 1 0; gap:4px; }
.smore:empty { display:none; }
.smonth .sday-num { font-size:19px; }
.smonth .smark { padding:4px 7px; font-size:13px; line-height:1.2; border-left-width:5px; }
.smonth .smark .mt { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:normal; }
.smonth .smark .mtime { display:none; }
.smonth .smark.one-line .mt { -webkit-line-clamp:1; }
.smonth .smark.one-line { padding-top:2px; padding-bottom:2px; }
.smonth .smarks:has(.one-line) { gap:3px; }
@media (max-width:699px) {
  .smonth .sday { padding:4px; gap:4px; border-width:2px; }
  .smonth .sday-num { font-size:16px; }
  .smonth .smore { display:none; }
  .smonth .smarks { gap:3px; }
  .smonth .smark { padding:0; height:7px; border:0; background:var(--mc); }
  .smonth .smark::before { display:none; }
  .smonth .smark.is-done { background:transparent; box-shadow:inset 0 0 0 2px var(--mc); }
  .smonth .smark .mt { display:none; }
  .smonth-dows span { font-size:9px; padding-left:2px; }
}

/* holidays: a quiet label under the date, not a marker */
.shol { flex-shrink:0; font:600 10.5px/1.25 var(--poster-mono); text-transform:uppercase; letter-spacing:.03em; color:var(--poster-ui-accent); overflow-wrap:break-word; }
.sday.is-today .shol { color:var(--poster-on-accent); }
.sdays .sday.is-today .shol { color:var(--poster-ui-accent); }
.sdays .shol { font-size:13px; }
.shol-star { display:none; margin-left:2px; font-size:.6em; vertical-align:top; color:var(--poster-ui-accent); }
.smonth .shol { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.smonth .shol-inline { display:none; text-align:right; }
.smonth .sday.hol-in .shol-inline { display:block; }
.smonth .sday.hol-in .shol-line { display:none; }
.smonth .sday-head { align-items:center; }
@media (max-width:699px) {
  .smonth .shol { display:none; }

}

/* your own events and reminders: a diamond instead of a checkbox */
.smark.is-event::before { content:""; width:10px; height:10px; margin:3px 2px 0; border:0; border-radius:0; background:var(--mc); transform:rotate(45deg); }
.ev-form { display:flex; flex-direction:column; gap:14px; }
.ev-form .modal-sub { margin-bottom:0; }
.ev-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.ev-field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.ev-field > span { font:600 11px/1.3 var(--poster-mono); text-transform:uppercase; letter-spacing:.05em; color:var(--poster-text-soft); }
.ev-field i { font-style:normal; opacity:.75; text-transform:none; }
.ev-field input, .ev-form textarea { width:100%; min-height:44px; min-width:0; padding:10px 12px; border:2px solid var(--poster-border); border-radius:0; background:var(--poster-bg); color:var(--poster-text); font:400 16px/1.4 var(--poster-sans); }
.ev-form textarea { min-height:80px; }
.ev-colors { display:flex; flex-wrap:wrap; gap:10px; }

.ev-colors button[aria-pressed="true"]::after { content:""; position:absolute; inset:-6px; border:2px solid var(--poster-text); border-radius:50%; }
.sday-add { flex-shrink:0; align-self:flex-start; margin-top:auto; min-height:38px; padding:6px 14px; border:2px dashed var(--poster-text-soft); background:transparent; color:var(--poster-text-soft); font:600 12px/1 var(--poster-mono); text-transform:uppercase; }
.sday-add:hover { border-style:solid; color:var(--poster-text); border-color:var(--poster-text); }
.sday.is-today .sday-add { color:inherit; border-color:currentColor; }
.sdrop-btns { display:flex; gap:6px; flex-wrap:wrap; }
.sdrop-btns .action-btn { flex:1 1 70px; }
.sdrop .action-btn.danger { color:var(--poster-danger); border-color:var(--poster-danger); }
@media (max-width:520px) { .ev-row { grid-template-columns:1fr; } }

/* tapping a marker opens a box right under it with the Homework buttons */
.sopen { display:flex; flex-direction:column; flex-shrink:0; min-width:0; }
.sopen .smark { border-bottom-width:0; }
.sdrop { display:flex; flex-direction:column; gap:8px; padding:8px; background:var(--poster-card-bg); color:var(--poster-text); border:1.5px solid var(--poster-border); border-left:5px solid var(--mc); border-top:1px dashed var(--poster-text-soft); cursor:default; }
.sdrop-when { font:600 10px/1.3 var(--poster-mono); text-transform:uppercase; color:var(--poster-text-soft); }
.sdrop-desc { margin:0; font:400 12.5px/1.45 var(--poster-sans); color:var(--poster-text-soft); }
.sdrop-actions { display:flex; flex-direction:column; gap:6px; }
.sdrop .action-btn { flex:0 0 auto; min-height:36px; padding:7px 8px; font-size:11px; }
.sweek .sday { overflow-y:auto; scrollbar-width:thin; }
.sdays .sdrop { padding:12px 14px; gap:10px; }
.sdays .sdrop-desc { font-size:14px; }
.sdays .sdrop-actions { flex-direction:row; flex-wrap:wrap; }
.sdays .sdrop .action-btn { flex:1 1 160px; min-height:44px; font-size:12px; }
.sdays .sopen .smark .mdesc { display:none; }

/* day: one box per day filling the space; scroll inside it to reach the next day */
.sdays { flex:1; min-height:0; overflow-y:auto; scroll-snap-type:y mandatory; display:flex; flex-direction:column; gap:var(--s-gap); overscroll-behavior:contain; scrollbar-width:none; }
.sdays::-webkit-scrollbar { display:none; }
.sdays .sday { flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; padding:18px; gap:14px; overflow-y:auto; box-shadow:none; }
.sdays .sday-num { font-size:44px; }
/* Day view: today is marked with blue text and outline, not a blue fill */
.sdays .sday.is-today { background:var(--poster-card-bg); color:var(--poster-text); border-color:var(--poster-ui-accent); }
.sdays .sday.is-today .sday-num, .sdays .sday.is-today .sday-dow { color:var(--poster-ui-accent); }
.sdays .sday.is-today .sday-empty { color:var(--poster-text-soft); opacity:1; }
.sdays .sday-dow { font-size:13px; }
.sdays .sday-head { justify-content:flex-start; gap:14px; }
.sdays .smarks { overflow:visible; }
.sdays .smark { padding:10px 12px; font-size:15px; }
.sdays .smark .mdesc { display:block; margin-top:6px; font:400 13px/1.45 var(--poster-sans); color:var(--poster-text-soft); }
.sdays-hint { flex-shrink:0; padding-top:8px; font:600 10px/1.3 var(--poster-mono); text-transform:uppercase; color:var(--poster-text-soft); text-align:center; }

/* ================= Notebook page =================
   One page per day. The date sits in the corner; flip back and forward through days.
   Four real notebook types, picked from the ☰ menu (data-nb on .nb):
   spiral (spiral-bound, turns sideways), legal (legal pad, flips up over the top),
   comp (composition book, turns like a book), eng (engineering pad, page tears off). */
body:has(#page-notebook:not([hidden])) { padding-bottom:0; }
.nb { max-width:900px; margin:0 auto; padding:4px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left)); }
.nb-bar { display:flex; align-items:center; gap:10px; margin:0 0 14px; }
.nb-bar h1 { margin:0 auto 0 0; min-width:0; font:800 clamp(28px,4vw,44px)/.9 var(--poster-display); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nb-saved { font:600 10px/1.2 var(--poster-mono); text-transform:uppercase; letter-spacing:.05em; color:var(--poster-text-soft); min-width:56px; text-align:right; }
.nb-menu-wrap { position:relative; }
.nb-menu-btn { width:40px; height:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border:2px solid var(--poster-border); background:var(--poster-card-bg); color:var(--poster-text); }
.nb-menu-btn span { display:block; width:18px; height:2px; background:currentColor; }
.nb-menu { position:absolute; top:calc(100% + 8px); right:0; z-index:50; width:260px; max-width:calc(100vw - 32px); padding:8px; display:flex; flex-direction:column; gap:4px; background:var(--poster-card-bg); color:var(--poster-text); border:3px solid var(--poster-border); box-shadow:5px 5px 0 var(--poster-border); }
.nb-menu-title { padding:4px 6px 6px; font:600 11px/1.2 var(--poster-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--poster-text-soft); }
.nb-opt { display:flex; align-items:center; gap:12px; width:100%; padding:8px 6px; border:2px solid transparent; background:transparent; color:inherit; text-align:left; font:600 15px/1.2 var(--poster-sans); }
.nb-opt:hover { background:var(--poster-accent-soft); }
.nb-opt[aria-checked="true"] { border-color:var(--poster-border); }
.nb-opt small { display:block; margin-top:2px; font:500 11px/1.3 var(--poster-sans); color:var(--poster-text-soft); }
.nb-swatch { flex-shrink:0; width:34px; height:42px; border:1.5px solid #00000055; }
.nb-swatch.spiral { background:linear-gradient(90deg, transparent 6px, #f08a8a 6px 7.5px, transparent 7.5px), repeating-linear-gradient(#fff 0 6px, #c8d9f2 6px 7px); border-left:4px dotted #555; }
.nb-swatch.legal { background:linear-gradient(90deg, transparent 8px, #e0605a 8px 9px, transparent 9px), repeating-linear-gradient(#FFF4A3 0 6px, #8fb3dc 6px 7px); border-top:6px solid #7b2f2a; }
.nb-swatch.comp { background:repeating-conic-gradient(#111 0 12deg, #eee 12deg 17deg, #111 17deg 35deg, #ddd 35deg 38deg) 0 0/14px 14px; }
.nb-swatch.eng { background:linear-gradient(#cfe3c4 1px, transparent 1px) 0 0/6px 6px, linear-gradient(90deg, #cfe3c4 1px, transparent 1px) 0 0/6px 6px, #EAF4E2; border-top:7px solid #EAF4E2; box-shadow:inset 0 1px 0 #6a9a5a; }

.nb-body { position:relative; min-height:0; padding:0 8px 8px 0; perspective:1800px; }
.nb-page { --line:32px; --ink:#1d2433; --paper:#ffffff; --rule:#c8d9f2; --margin:#f08a8a;
  position:absolute; inset:0 8px 8px 0; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); }
.nb-head { flex-shrink:0; display:flex; align-items:baseline; justify-content:flex-end; gap:10px; padding:18px 22px 6px; }
.nb-dow { font:700 15px/1 var(--poster-mono); text-transform:uppercase; letter-spacing:.08em; opacity:.6; }
.nb-date { font:700 22px/1 var(--poster-display); text-transform:uppercase; }
.nb-label { display:none; }
.nb-text { flex:1; min-height:0; width:100%; resize:none; border:0; outline:none; background-color:transparent; color:inherit;
  padding:0 22px 22px; font:400 17px/var(--line) var(--poster-sans); background-attachment:local; }
.nb-text:focus-visible { outline:none; }
.nb-text::placeholder { color:inherit; opacity:.35; }
/* the page that's turning (a copy laid on top while it animates) */
.nb-turn { z-index:5; pointer-events:none; backface-visibility:hidden; will-change:transform; }
.nb-turn::selection { background:transparent; }

/* ---- 1. Spiral notebook: ruled lines, red margin, wire coil, handwriting ---- */
.nb[data-nb="spiral"] .nb-page { border:1.5px solid #b9c3d3; border-left:0; border-radius:2px 8px 8px 2px; padding-left:34px; box-shadow:4px 4px 0 var(--poster-border);
  background-image:radial-gradient(circle at 18px 50%, var(--poster-bg) 5px, #9aa4b2 5.5px, transparent 6.5px); background-size:34px 22px; background-repeat:repeat-y; }
.nb[data-nb="spiral"] .nb-page::before { content:""; position:absolute; top:6px; bottom:6px; left:-6px; width:26px; z-index:2;
  background:repeating-linear-gradient(transparent 0 6px, #6b7280 6px 9px, #d1d5db 9px 10px, transparent 10px 22px); border-radius:6px; }
.nb[data-nb="spiral"] .nb-page::after { content:""; position:absolute; top:0; bottom:0; left:88px; width:2px; background:var(--margin); opacity:.85; }
.nb[data-nb="spiral"] .nb-head { border-bottom:2px solid var(--rule); }
.nb[data-nb="spiral"] .nb-dow { font:700 22px/1 "Caveat", cursive; text-transform:none; letter-spacing:0; opacity:.7; }
.nb[data-nb="spiral"] .nb-date { font:700 30px/1 "Caveat", cursive; text-transform:none; }
.nb[data-nb="spiral"] .nb-text { padding-left:66px; font:500 24px/var(--line) "Caveat", cursive;
  background-image:linear-gradient(transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px)); background-size:100% var(--line); }
.nb[data-nb="spiral"] .nb-turn { transform-origin:0 50%; }
.nb[data-nb="spiral"] .nb-turn.go-next { animation:spiralOut .62s cubic-bezier(.45,.05,.35,1) forwards; }
.nb[data-nb="spiral"] .nb-turn.go-prev { animation:spiralOut .62s cubic-bezier(.45,.05,.35,1) reverse forwards; }
@keyframes spiralOut {
  0%   { transform:rotateY(0); box-shadow:4px 4px 0 var(--poster-border); filter:brightness(1); }
  45%  { filter:brightness(.92); box-shadow:-30px 10px 40px #0004; }
  100% { transform:rotateY(-178deg); box-shadow:none; filter:brightness(.8); }
}

/* ---- 2. Legal pad: yellow, blue rules, double red margin; pages flip up over the glued top ---- */
.nb[data-nb="legal"] .nb-page { --paper:#FFF4A3; --ink:#1f2a3a; --rule:#8fb3dc; --margin:#e0605a; box-shadow:4px 6px 0 var(--poster-border); }
.nb[data-nb="legal"] .nb-body::before { content:""; position:absolute; z-index:6; top:-10px; left:-4px; right:4px; height:24px; background:#7b2f2a; box-shadow:0 2px 0 #5c211d; }
.nb[data-nb="legal"] .nb-page::before, .nb[data-nb="legal"] .nb-page::after { content:""; position:absolute; top:0; bottom:0; width:1.5px; background:var(--margin); left:64px; }
.nb[data-nb="legal"] .nb-page::after { left:69px; }
.nb[data-nb="legal"] .nb-head { padding-top:24px; padding-bottom:10px; }
.nb[data-nb="legal"] .nb-dow { font-size:12px; }
.nb[data-nb="legal"] .nb-date { font:600 20px/1 var(--poster-mono); letter-spacing:-.02em; }
.nb[data-nb="legal"] .nb-text { padding-left:84px; font:400 16px/var(--line) var(--poster-sans);
  background-image:linear-gradient(transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px)); background-size:100% var(--line); }
.nb[data-nb="legal"] .nb-turn { transform-origin:50% 0; }
.nb[data-nb="legal"] .nb-turn.go-next { animation:legalUp .6s cubic-bezier(.5,0,.3,1) forwards; }
.nb[data-nb="legal"] .nb-turn.go-prev { animation:legalUp .6s cubic-bezier(.5,0,.3,1) reverse forwards; }
@keyframes legalUp {
  0%   { transform:rotateX(0); filter:brightness(1); }
  50%  { filter:brightness(.9); box-shadow:0 -20px 40px #0003; }
  100% { transform:rotateX(178deg); filter:brightness(.75); box-shadow:none; }
}

/* ---- 3. Composition book: marbled cover around the page, college rule, DATE line; turns like a book ---- */
.nb[data-nb="comp"] .nb-body { padding:0 8px 8px 0; }
.nb[data-nb="comp"] .nb-page { --line:28px; --rule:#a9c4e8; --margin:#e57373; border:12px solid #111; border-left-width:16px;
  border-image:repeating-conic-gradient(#111 0 12deg, #f2f2f2 12deg 16deg, #111 16deg 33deg, #cfcfcf 33deg 36deg) 12; box-shadow:4px 4px 0 var(--poster-border); }
.nb[data-nb="comp"] .nb-page::after { content:""; position:absolute; top:0; bottom:0; left:56px; width:1.5px; background:var(--margin); }
.nb[data-nb="comp"] .nb-head { justify-content:space-between; align-items:flex-end; padding:16px 18px 8px 70px; }
.nb[data-nb="comp"] .nb-label { display:flex; align-items:baseline; gap:8px; flex:1; max-width:280px; font:600 11px/1 var(--poster-mono); letter-spacing:.08em; color:#555; }
.nb[data-nb="comp"] .nb-label b { flex:1; border-bottom:1.5px solid #555; padding:0 4px 2px; font:700 22px/1 "Caveat", cursive; color:var(--ink); letter-spacing:0; }
.nb[data-nb="comp"] .nb-date { display:none; }
.nb[data-nb="comp"] .nb-dow { font:700 20px/1 "Caveat", cursive; text-transform:none; letter-spacing:0; }
.nb[data-nb="comp"] .nb-text { padding-left:70px; font:500 22px/var(--line) "Caveat", cursive;
  background-image:linear-gradient(transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px)); background-size:100% var(--line); }
.nb[data-nb="comp"] .nb-turn { transform-origin:0 50%; }
.nb[data-nb="comp"] .nb-turn.go-next { animation:compTurn .8s cubic-bezier(.55,.1,.3,1) forwards; }
.nb[data-nb="comp"] .nb-turn.go-prev { animation:compTurn .8s cubic-bezier(.55,.1,.3,1) reverse forwards; }
@keyframes compTurn {
  0%   { transform:rotateY(0) skewY(0); filter:brightness(1); }
  30%  { transform:rotateY(-40deg) skewY(-2deg); filter:brightness(.97); box-shadow:-20px 0 40px #0003; }
  70%  { transform:rotateY(-140deg) skewY(2deg); filter:brightness(.85); }
  100% { transform:rotateY(-180deg) skewY(0); filter:brightness(.8); box-shadow:none; }
}

/* ---- 4. Engineering pad: pale green grid, DATE / PAGE header boxes; the sheet tears off ---- */
.nb[data-nb="eng"] .nb-page { --line:24px; --paper:#EAF4E2; --ink:#1f3324; border-top:4px solid #2f5d34; box-shadow:4px 4px 0 var(--poster-border); }
.nb[data-nb="eng"] .nb-head { justify-content:flex-start; align-items:stretch; gap:0; padding:0; border-bottom:2px solid #6a9a5a; }
.nb[data-nb="eng"] .nb-head > * { padding:10px 14px; border-right:1.5px solid #6a9a5a; }
.nb[data-nb="eng"] .nb-label { display:block; flex:1; border-right:0; font:600 10px/1.2 var(--poster-mono); letter-spacing:.08em; color:#4b6b4f; }
.nb[data-nb="eng"] .nb-label b { display:block; margin-top:4px; font:600 18px/1 var(--poster-mono); color:var(--ink); letter-spacing:-.02em; }
.nb[data-nb="eng"] .nb-dow { order:-1; display:flex; flex-direction:column; justify-content:center; font:600 10px/1.2 var(--poster-mono); opacity:1; color:#4b6b4f; }
.nb[data-nb="eng"] .nb-date { order:-1; font:600 18px/1 var(--poster-mono); letter-spacing:-.02em; display:flex; align-items:center; }
.nb[data-nb="eng"] .nb-text { padding:12px 24px 24px; font:500 15px/var(--line) var(--poster-mono); text-transform:uppercase;
  background-image:linear-gradient(#c6dcba 1px, transparent 1px), linear-gradient(90deg, #c6dcba 1px, transparent 1px), linear-gradient(#a8c79a 1px, transparent 1px), linear-gradient(90deg, #a8c79a 1px, transparent 1px);
  background-size:var(--line) var(--line), var(--line) var(--line), calc(var(--line) * 5) calc(var(--line) * 5), calc(var(--line) * 5) calc(var(--line) * 5); }
.nb[data-nb="eng"] .nb-turn { transform-origin:50% 0; }
.nb[data-nb="eng"] .nb-turn.go-next { animation:engTear .7s cubic-bezier(.5,0,.75,0) forwards; }
.nb[data-nb="eng"] .nb-turn.go-prev { animation:engTear .55s cubic-bezier(.25,1,.5,1) reverse forwards; }
@keyframes engTear {
  0%   { transform:translateY(0) rotate(0); opacity:1; }
  18%  { transform:translateY(6px) rotate(-1.5deg); }
  100% { transform:translateY(105%) translateX(8%) rotate(9deg); opacity:0; }
}

@media (max-width:520px) {
  .nb-bar { gap:8px; }
  .nb-saved { display:none; }
  .nb[data-nb="spiral"] .nb-page::after { left:62px; }
  .nb[data-nb="spiral"] .nb-text { padding-left:40px; padding-right:12px; }
  .nb[data-nb="legal"] .nb-page::before { left:36px; } .nb[data-nb="legal"] .nb-page::after { left:41px; }
  .nb[data-nb="legal"] .nb-text { padding-left:52px; padding-right:12px; }
  .nb[data-nb="comp"] .nb-page::after { left:40px; }
  .nb[data-nb="comp"] .nb-head { padding-left:48px; }
  .nb[data-nb="comp"] .nb-text { padding-left:48px; padding-right:10px; }
  .nb[data-nb="eng"] .nb-head > * { padding:8px 10px; }

}

</style>
</head>

const defaultAssignments = assignments;

const knownClassColors = {
  "Visual Merchandising": "#ea4335",
  "Aesthetics": "#a142f4",
  "Digital Addiction": "#12b5cb",
  "Thesis 1": "#fbbc04"
};
const extraPalette = ["#e67c73","#33b679","#8e24aa","#3f51b5","#0b8043","#d50000","#f4511e","#039be5","#c2185b","#00897b"];
let classColorOverrides = {};
try { classColorOverrides = JSON.parse(localStorage.getItem("classColorOverrides") || "{}"); } catch(e) { classColorOverrides = {}; }
function saveClassColorOverrides() { try { localStorage.setItem("classColorOverrides", JSON.stringify(classColorOverrides)); } catch(e) {} }
function getClassColor(cls) {
  if (classColorOverrides[cls]) return classColorOverrides[cls];
  if (knownClassColors[cls]) return knownClassColors[cls];
  let hash = 0;
  for (let i = 0; i < cls.length; i++) hash = cls.charCodeAt(i) + ((hash << 5) - hash);
  return extraPalette[Math.abs(hash) % extraPalette.length];
}

let customAssignments = [];
try { customAssignments = JSON.parse(localStorage.getItem("customAssignments") || "[]"); } catch(e) { customAssignments = []; }
function saveCustomAssignments() { try { localStorage.setItem("customAssignments", JSON.stringify(customAssignments)); } catch(e) {} }
// Deleted classes: { "Class name": timeDeleted }. Assignments in that class
// that existed before it was deleted are hidden everywhere; if you add the same
// class again later from a syllabus, the new ones show up normally.
let removedClasses = {};
try { removedClasses = JSON.parse(localStorage.getItem("removedClasses") || "{}"); } catch(e) { removedClasses = {}; }
function saveRemovedClasses() { try { localStorage.setItem("removedClasses", JSON.stringify(removedClasses)); } catch(e) {} }
function createdAt(a) { const m = /^custom-(\d+)/.exec(a.id || ""); return m ? Number(m[1]) : 0; }
function isRemoved(a) { const t = removedClasses[a.class]; return !!t && createdAt(a) < t; }
function pruneRemoved() {
  const before = customAssignments.length;
  customAssignments = customAssignments.filter(a => !isRemoved(a));
  if (customAssignments.length !== before) saveCustomAssignments();
}
pruneRemoved();

function deleteClass(cls) {
  removedClasses[cls] = Date.now();
  saveRemovedClasses();
  pruneRemoved();
  delete classColorOverrides[cls];
  saveClassColorOverrides();
  if (activeFilter === cls) activeFilter = "All";
  scheduleSync();
  render();
  renderCustomizePanel();
}

function getAllAssignments() { return [...defaultAssignments, ...customAssignments].filter(a => !isRemoved(a)); }
function getAllClasses() { return [...new Set(getAllAssignments().map(a => a.class))]; }

// state[id] = { complete, turned, t }  — t is when it last changed, so syncing
// between devices keeps whichever change is newest.
let state = {};
try { state = JSON.parse(localStorage.getItem("assignmentState") || "{}"); } catch(e) { state = {}; }
function saveState() { try { localStorage.setItem("assignmentState", JSON.stringify(state)); } catch(e) {} }

// When colours / header palette last changed (for syncing those too)
let prefsT = 0;
try { prefsT = parseInt(localStorage.getItem("prefsUpdatedAt") || "0", 10) || 0; } catch(e) { prefsT = 0; }
function touchPrefs() { prefsT = Date.now(); try { localStorage.setItem("prefsUpdatedAt", String(prefsT)); } catch(e) {} }

// Ask the browser to treat saved progress as persistent so it isn't cleared to free up space
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

let activeFilter = "All";
let openId = null;
let activeView = "todo";
const lingering = new Set(); // just-finished items stay visible for a moment before moving

// An assignment moves to the Done page once it's BOTH marked complete AND turned in
function isFinished(a) { const s = state[a.id] || {}; return !!(s.complete && s.turned); }

document.querySelectorAll(".view-tab").forEach(tab => {
  tab.onclick = () => { activeView = tab.dataset.view; openId = null; render(); window.scrollTo({ top: 0 }); };
});

function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

function getTodayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function todayMarkerHTML() {
  const label = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  return `
    <div class="today-marker-row">
      <div class="today-marker-rail">
        <div class="today-marker-node"></div>
        <div class="today-marker-line"></div>
      </div>
      <div class="today-marker-content">
        <div class="today-marker-label">Today — ${label}</div>
      </div>
    </div>
  `;
}

function render() {
  const allAssignments = getAllAssignments();
  const classes = getAllClasses();
  const filters = ["All", ...classes];
  const filterEl = document.getElementById("filters");
  filterEl.innerHTML = filters.map(f => {
    const color = f === "All" ? "#1a73e8" : getClassColor(f);
    const active = f === activeFilter;
    return `<button class="filter-btn ${active?'active':''}" data-f="${f}" style="${active ? `background:${color};` : ''}">
      <span class="dot" style="background:${color}"></span>${f}
    </button>`;
  }).join("");
  filterEl.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => { activeFilter = btn.dataset.f; render(); };
  });

  const classFiltered = activeFilter === "All" ? allAssignments : allAssignments.filter(a => a.class === activeFilter);
  const total = classFiltered.length;
  const doneCount = classFiltered.filter(isFinished).length;
  const pct = total ? Math.round((doneCount/total)*100) : 0;
  document.getElementById("progressText").textContent = `${doneCount} of ${total} done & turned in`;

  document.getElementById("todoCount").textContent = total - doneCount;
  document.getElementById("doneCount").textContent = doneCount;
  document.querySelectorAll(".view-tab").forEach(t => t.classList.toggle("active", t.dataset.view === activeView));

  const isDoneView = activeView === "done";
  const filtered = classFiltered.filter(a => isDoneView ? (isFinished(a) && !lingering.has(a.id)) : (!isFinished(a) || lingering.has(a.id)));
  document.getElementById("progressPct").textContent = `${pct}%`;
  document.getElementById("progressFill").style.width = pct + "%";

  const grouped = {};
  filtered.forEach(a => { (grouped[a.date] ||= []).push(a); });
  // To Do: oldest due date first. Done: most recent first.
  const dates = Object.keys(grouped).sort();
  if (isDoneView) dates.reverse();
  const todayStr = getTodayStr();

  const listEl = document.getElementById("list");
  listEl.classList.toggle("done-view", isDoneView);
  let html = "";
  let todayPlaced = isDoneView; // no Today marker on the Done page

  dates.forEach((date, i) => {
    if (!todayPlaced && date > todayStr) {
      html += todayMarkerHTML();
      todayPlaced = true;
    }
    const isToday = date === todayStr;
    if (isToday) todayPlaced = true;

    const items = grouped[date].map(a => {
      const s = state[a.id] || {};
      const isOpen = openId === a.id;
      // Past due = its date is before today and it isn't both done and turned in
      const overdue = a.date < todayStr && !isFinished(a);
      return `
        <div class="card ${overdue ? 'overdue' : ''}" data-id="${a.id}" style="--accent:${getClassColor(a.class)}">
          <div class="card-top">
            <div class="card-left">
              <span class="tag" style="background:${getClassColor(a.class)}">${a.class}</span>
              <div class="title">${a.title}</div>
              <div class="time">${a.time}</div>
            </div>
            <div class="status-pills">
              ${overdue ? '<span class="pill overdue">Past due</span>' : ''}
              <span class="pill ${s.complete?'on complete':''}">${s.complete?'Complete':'Not done'}</span>
              <span class="pill ${s.turned?'on turned':''}">${s.turned?'Turned in':'Not submitted'}</span>
            </div>
          </div>
          <div class="details ${isOpen?'open':''}">
            <div>${a.desc}</div>
            <div class="actions">
              <button class="action-btn complete ${s.complete?'on':''}" data-action="complete" data-id="${a.id}">${s.complete ? 'Marked Complete' : 'Mark Complete'}</button>
              <button class="action-btn turned ${s.turned?'on':''}" data-action="turned" data-id="${a.id}">${s.turned ? 'Marked Turned In' : 'Mark Turned In'}</button>
            </div>
          </div>
        </div>
      `;
    }).join("");

    const isLast = i === dates.length - 1;
    const nodeColor = getClassColor(grouped[date][0].class);
    html += `
      <div class="date-row" ${isLast && todayPlaced ? 'style="padding-bottom:0"' : ''}>
        <div class="date-rail">
          <div class="date-node ${isToday ? 'is-today' : ''}" style="${isToday ? '' : `background:${nodeColor};box-shadow:0 0 0 1.5px ${nodeColor}`}"></div>
          <div class="date-line"></div>
        </div>
        <div class="date-content">
          <div class="date-heading ${isToday ? 'is-today' : ''}">${fmtDate(date)}${isToday ? '<span class="today-chip">Today</span>' : ''}</div>
          ${items}
        </div>
      </div>
    `;
  });

  if (!todayPlaced) html += todayMarkerHTML();

  if (dates.length === 0) {
    html = isDoneView
      ? `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-title">Nothing here yet</div><div class="empty-state-text">Assignments land here once they're marked complete and turned in.</div></div>`
      : `<div class="empty-state"><div class="empty-state-icon">🎉</div><div class="empty-state-title">All caught up</div><div class="empty-state-text">Everything${activeFilter === "All" ? "" : " for " + activeFilter} is done and turned in.</div></div>`;
  }

  listEl.innerHTML = html;

  listEl.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", (e) => {
      if (e.target.dataset.action) return;
      const id = card.dataset.id;
      openId = openId === id ? null : id;
      render();
    });
  });
  listEl.querySelectorAll(".action-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (!state[id]) state[id] = {};
      const turningOn = !state[id][action];
      state[id][action] = turningOn;
      state[id].t = Date.now();
      saveState();
      scheduleSync();
      const a = getAllAssignments().find(x => x.id === id);
      if (turningOn && a && isFinished(a)) {
        launchConfetti();
        // brief pause so you see it get checked off before it moves to Done
        lingering.add(id);
        render();
        setTimeout(() => { lingering.delete(id); if (openId === id) openId = null; render(); }, 900);
        return;
      }
      if (action === "turned" && turningOn) launchConfetti();
      render();
    });
  });

  // Keep the Customize panel in sync, but don't rebuild it while it's open
  // (that would close the colour picker mid-drag).
  if (!document.getElementById("customizePanel").classList.contains("open")) renderCustomizePanel();
}

/* ---- customize: header palette + per-class colors ---- */

// Each palette's light/dark header fill + readable text color on top of it.
const PALETTE_OPTIONS = [

  { id: "orange", label: "Orange", light: "#FF822E", lightInk: "#171914", dark: "#FFB98A", darkInk: "#171914" },
  { id: "amber", label: "Amber", light: "#E8A400", lightInk: "#171914", dark: "#FFE08A", darkInk: "#171914" },
  { id: "green", label: "Green", light: "#1E8E3E", lightInk: "#FFFFFF", dark: "#9FE6B3", darkInk: "#171914" },
  { id: "teal", label: "Teal", light: "#08766B", lightInk: "#FFFFFF", dark: "#79DAC6", darkInk: "#171914" },
  { id: "blue", label: "Blue", light: "#2459F6", lightInk: "#FFFFFF", dark: "#A2BEFF", darkInk: "#171914" },
  { id: "violet", label: "Violet", light: "#7447DB", lightInk: "#FFFFFF", dark: "#C1A3FF", darkInk: "#171914" },

function getSavedPaletteId() {
  try { return localStorage.getItem("posterPalette") || "blue"; } catch(e) { return "blue"; }
}
function savePaletteId(id) {
  try { localStorage.setItem("posterPalette", id); } catch(e) {}
}

// Set the actual header colors as inline custom properties on <html>.
// Inline style beats every stylesheet rule regardless of selector specificity,
// so this is guaranteed to take effect no matter what else the CSS does.
function applyPalette(id) {
  const opt = PALETTE_OPTIONS.find(p => p.id === id) || PALETTE_OPTIONS[0];
  const root = document.documentElement.style;
  root.setProperty("--poster-header-day", opt.light);
  root.setProperty("--poster-header-day-ink", opt.lightInk);
  root.setProperty("--poster-header-night", opt.dark);
  root.setProperty("--poster-header-night-ink", opt.darkInk);
  document.documentElement.dataset.palette = id;
  // Saved so the <head> script can paint the right header before anything loads
  try { localStorage.setItem("posterPaletteVars", JSON.stringify([opt.light, opt.lightInk, opt.dark, opt.darkInk])); } catch(e) {}
}

let currentPaletteId = getSavedPaletteId();
applyPalette(currentPaletteId);

// Colours picked before sync existed have no timestamp, so they'd never be
// uploaded. Give them the oldest possible one: they get shared, but any real
// change made on another device still wins.
(function seedOldPrefs() {
  let hadPalette = false;
  try { hadPalette = !!localStorage.getItem("posterPalette"); } catch(e) {}
  if (prefsT === 0 && (hadPalette || Object.keys(classColorOverrides).length)) {
    prefsT = 1;
    try { localStorage.setItem("prefsUpdatedAt", "1"); } catch(e) {}
  }
})();

function renderCustomizePanel() {
  const swatchesEl = document.getElementById("paletteSwatches");
  swatchesEl.innerHTML = PALETTE_OPTIONS.map(p => `
    <button class="palette-swatch ${p.id === currentPaletteId ? 'selected' : ''}"
      style="background:${p.light}" data-palette-id="${p.id}"
      aria-label="${p.label}" title="${p.label}"></button>
  `).join("");
  swatchesEl.querySelectorAll(".palette-swatch").forEach(btn => {
    btn.addEventListener("click", () => {
      currentPaletteId = btn.dataset.paletteId;
      applyPalette(currentPaletteId);
      savePaletteId(currentPaletteId);
      touchPrefs();
      scheduleSync();
      renderCustomizePanel();
    });
  });

  const classes = getAllClasses();
  const listEl = document.getElementById("classColorList");
  if (classes.length === 0) {
    listEl.innerHTML = `<div class="class-color-empty">Add a syllabus to add a class.</div>`;
    return;
  }
  listEl.innerHTML = classes.map(cls => {
    const safe = cls.replace(/"/g, '&quot;');
    return `
    <div class="class-color-row">
      <span class="ccr-name">${cls}</span>
      <input type="color" value="${getClassColor(cls)}" data-class="${safe}" aria-label="Color for ${safe}">
      <button class="ccr-delete" data-class="${safe}" aria-label="Delete ${safe}" title="Delete class">✕</button>
    </div>`;
  }).join("");
  // Two taps to delete: first tap asks, second tap within 4s deletes.
  listEl.querySelectorAll(".ccr-delete").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("confirm")) { deleteClass(btn.dataset.class); return; }
      const count = getAllAssignments().filter(a => a.class === btn.dataset.class).length;
      btn.classList.add("confirm");
      btn.textContent = `Delete ${count}?`;
      setTimeout(() => { if (btn.isConnected) { btn.classList.remove("confirm"); btn.textContent = "✕"; } }, 4000);
    });
  });
  listEl.querySelectorAll('input[type="color"]').forEach(input => {
    input.addEventListener("input", () => {
      classColorOverrides[input.dataset.class] = input.value;
      saveClassColorOverrides();
      touchPrefs();
      scheduleSync();
      render();
    });
  });
}

/* ---- cloud sync ----
   Progress is saved on this device AND in the cloud. Every device that opens
   this link shares the same built-in key, so they all show the same thing —
   no code to enter. */

// Replace with your deployed sync Worker URL, e.g.
// "https://coursely-sync.yourname.workers.dev"
const SYNC_URL = "https://checklist.tavan388.workers.dev/sync";
// One shared key for everyone who opens this link (must look like XXXX-XXXX).
const SYNC_KEY = "NICK-MAIN";
const LIVE_REFRESH_MS = 20000; // check for changes from other devices every 20s

const syncStatusEl = document.getElementById("syncStatus");

function setSyncStatus(msg, isError) {
  syncStatusEl.textContent = msg;
  syncStatusEl.classList.toggle("error", !!isError);
}

function syncConfigured() { return SYNC_URL && SYNC_URL !== "PASTE_YOUR_SYNC_WORKER_URL_HERE"; }

function localBundle() {
  return { state, customAssignments, classColorOverrides, palette: currentPaletteId, prefsT, removedClasses };
}

// Newest change per assignment wins; custom assignments are combined;
// newest colour settings win. Returns true if anything changed locally.
function mergeRemote(remote) {
  if (!remote) return false;
  let changed = false;
  // Classes deleted on another device (keep the most recent deletion time)
  for (const [cls, t] of Object.entries(remote.removedClasses || {})) {
    if ((t || 0) > (removedClasses[cls] || 0)) {
      removedClasses[cls] = t; changed = true;
      if (activeFilter === cls) activeFilter = "All";
    }
  }
  if (changed) saveRemovedClasses();
  for (const [id, r] of Object.entries(remote.state || {})) {
    const l = state[id];
    if (!l || (r.t || 0) > (l.t || 0)) { state[id] = r; changed = true; }
  }
  const ids = new Set(customAssignments.map(a => a.id));
  (remote.customAssignments || []).forEach(a => {
    if (a && a.id && !ids.has(a.id) && !isRemoved(a)) { customAssignments.push(a); ids.add(a.id); changed = true; }
  });
  pruneRemoved();
  if ((remote.prefsT || 0) > prefsT) {
    classColorOverrides = remote.classColorOverrides || {};
    if (remote.palette) { currentPaletteId = remote.palette; applyPalette(currentPaletteId); savePaletteId(currentPaletteId); }
    prefsT = remote.prefsT;
    try { localStorage.setItem("prefsUpdatedAt", String(prefsT)); } catch(e) {}
    saveClassColorOverrides();
    changed = true;
  }
  if (changed) { saveState(); saveCustomAssignments(); }
  return changed;
}

let syncing = false, syncAgain = false, syncTimer = null;

async function syncNow() {
  if (!syncConfigured()) { setSyncStatus("Cloud sync not set up yet — saving on this device only."); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  setSyncStatus("Syncing…");
  try {
    // POST sends our changes; the server merges and returns everything.
    const resp = await fetch(`${SYNC_URL}?code=${encodeURIComponent(SYNC_KEY)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(localBundle())
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || "Sync failed");
    if (mergeRemote(data)) render();
    setSyncStatus("Synced " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
  } catch (e) {
    setSyncStatus("Offline — saved on this device, will sync later.", true);
  }
  syncing = false;
  if (syncAgain) { syncAgain = false; syncNow(); }
}

function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 600);
}

// While the app is on screen, quietly check for changes from other devices
setInterval(() => { if (document.visibilityState === "visible") syncNow(); }, LIVE_REFRESH_MS);

// Pull the latest whenever the app is opened or brought back to the front
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("focus", () => syncNow());
// Another tab of this same browser changed something
window.addEventListener("storage", (e) => {
  if (e.key === "assignmentState") {
    try { state = JSON.parse(e.newValue || "{}"); } catch(err) {}
    render();
  }
});

render();
syncNow();

/* ---- confetti ---- */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

const confettiColors = ["#ea4335", "#a142f4", "#12b5cb", "#fbbc04", "#1e8e3e", "#1a73e8"];
let particles = [];
let animId = null;

function launchConfetti() {
  const originX = window.innerWidth / 2;
  const originY = window.innerHeight * 0.25;
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: originX + (Math.random() - 0.5) * 60,
      y: originY,
      vx: (Math.random() - 0.5) * 9,
      vy: Math.random() * -8 - 4,
      size: Math.random() * 6 + 4,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 14,
      shape: Math.random() > 0.5 ? "rect" : "circle",
      life: 0
    });
  }
  if (!animId) animId = requestAnimationFrame(tick);
}

function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.vy += 0.28;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vrot;
    p.life++;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color;
    if (p.shape === "rect") {
      ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.66);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size/2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
  particles = particles.filter(p => p.y < canvas.height + 40 && p.life < 240);
  if (particles.length > 0) {
    animId = requestAnimationFrame(tick);
  } else {
    animId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

const DOW = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function sParse(s) { return new Date(s + "T00:00:00"); }
function sKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function sAdd(s, n) { const d = sParse(s); d.setDate(d.getDate() + n); return sKey(d); }
function sMonday(s) { const d = sParse(s); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return sKey(d); }
function sEsc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }

const EVENT_COLORS = ["#FF7849", "#2459F6", "#1E9E5A", "#C2185B", "#7447DB", "#171914"];
function fmtTime(t) {
  if (!t) return "";
  const [hh, mm] = t.split(":").map(Number);
  return `${hh % 12 || 12}${mm ? ":" + String(mm).padStart(2,"0") : ""}${hh < 12 ? "am" : "pm"}`;

// Major US holidays, worked out for any year. Cultural ones like Halloween and
// Christmas are in; religious observances (Jewish, Islamic, Lenten days, etc.) are left out.
const holidayCache = {};
function holidaysFor(year) {
  if (holidayCache[year]) return holidayCache[year];
  const out = {};
  const put = (m, d, name) => { out[`${year}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`] = name; };
  // nth weekday of a month (wd: 0 = Sunday); n = -1 means the last one
  const nth = (m, wd, n) => {
    if (n > 0) { const first = new Date(year, m-1, 1).getDay(); return 1 + ((wd - first + 7) % 7) + (n-1) * 7; }
    const lastDate = new Date(year, m, 0).getDate(), lastWd = new Date(year, m-1, lastDate).getDay();
    return lastDate - ((lastWd - wd + 7) % 7);
  };
  put(1, 1, "New Year's Day");
  put(1, nth(1, 1, 3), "Martin Luther King Jr. Day");
  put(2, 14, "Valentine's Day");
  put(2, nth(2, 1, 3), "Presidents' Day");
  put(3, 17, "St. Patrick's Day");
  // Easter Sunday (anonymous Gregorian algorithm)
  { const a = year % 19, b = Math.floor(year/100), c = year % 100, d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25),
      g = Math.floor((b-f+1)/3), hh = (19*a+b-d-g+15) % 30, i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-hh-k) % 7,
      m = Math.floor((a+11*hh+22*l)/451), month = Math.floor((hh+l-7*m+114)/31), day = ((hh+l-7*m+114) % 31) + 1;
    put(month, day, "Easter"); }
  put(5, nth(5, 0, 2), "Mother's Day");
  put(5, nth(5, 1, -1), "Memorial Day");
  put(6, nth(6, 0, 3), "Father's Day");
  put(6, 19, "Juneteenth");
  put(7, 4, "Independence Day");
  put(9, nth(9, 1, 1), "Labor Day");
  put(10, nth(10, 1, 2), "Indigenous Peoples' Day");
  put(10, 31, "Halloween");
  { const firstMon = nth(11, 1, 1); put(11, firstMon + 1, "Election Day"); }
  put(11, 11, "Veterans Day");
  put(11, nth(11, 4, 4), "Thanksgiving");
  put(12, 24, "Christmas Eve");
  put(12, 25, "Christmas");
  put(12, 31, "New Year's Eve");
  return holidayCache[year] = out;
}
function holidayOn(key) { return holidaysFor(+key.slice(0,4))[key] || ""; }
