<script>
// Apply the saved header colour immediately so reloads don't flash the default blue.
try {
  var v = JSON.parse(localStorage.getItem("posterPaletteVars") || "null");
  if (v && v.length === 4) {
    var r = document.documentElement.style;
    r.setProperty("--poster-header-day", v[0]);
    r.setProperty("--poster-header-day-ink", v[1]);
    r.setProperty("--poster-header-night", v[2]);
    r.setProperty("--poster-header-night-ink", v[3]);
  }
} catch (e) {}
</script>
<style>
/* POSTER · WHITE + COLOR STUDY
   Full replacement for the original <style> block (or the previous Poster CSS).
   White light-mode body; original dark body; original typography and layout.
   Default: electric blue in light mode, ice blue in dark mode.

   Color choices on <html>:
     data-palette="blue" | "violet" | "orange" | "teal" | "blue-peach"
   Header behavior:
     data-header-mode="adaptive" (default) or "fixed" (same color in both modes)
   Appearance:
     data-theme="light" | "dark"; omit to follow the device.

   Example: <html data-palette="blue-peach" data-header-mode="adaptive">
   Keep your existing assignment/upload JavaScript. No new backend required.
*/
@import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap");
:root {
  --poster-bg:#ffffff;
  --poster-card-bg:#ffffff;
  --poster-text:#171914;
  --poster-text-soft:#616161;
  --poster-border:#171914;
  --poster-ui-accent:var(--poster-header-fill);
  --poster-on-accent:var(--poster-header-ink);
  --poster-accent-soft:#f2f2f2;
  --poster-track:#e9e9e9;
  --poster-done:#255938;
  --poster-done-bg:#e1edce;
  --poster-turned:#245b76;
  --poster-turned-bg:#dcecf3;
  --poster-danger:#ad302a;
  --poster-scrim:#12140f77;
  --poster-sans:"Space Grotesk", "Arial", sans-serif;
  --poster-display:"Barlow Condensed", Impact, "Arial Narrow", sans-serif;
  --poster-mono:ui-monospace, "SFMono-Regular", monospace;
}

/* Complete replacement for the original <style> block. No markup changes required.
   Class colours stay in the existing JavaScript; the theme controls app chrome.
   Explicit theme: <html data-theme="light"> or <html data-theme="dark">.
   With no data-theme, follows the device. */
:root {
  --poster-space-1:4px; --poster-space-2:8px; --poster-space-3:12px; --poster-space-4:16px;
  --poster-space-5:24px; --poster-space-6:32px; --poster-space-7:48px; --poster-space-8:64px;
  --poster-radius:10px; --poster-control-radius:8px; --poster-shadow:none;
  color-scheme:light;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body {
  margin:0; padding:0 0 max(40px,env(safe-area-inset-bottom));
  background:var(--poster-bg); color:var(--poster-text); font:400 16px/1.5 var(--poster-sans);
  -webkit-font-smoothing:antialiased; overflow-wrap:anywhere;
}
button,input,textarea { font:inherit; }
button { cursor:pointer; touch-action:manipulation; }
button,textarea,input { -webkit-tap-highlight-color:transparent; }
button:focus-visible,input:focus-visible,textarea:focus-visible,[role="button"]:focus-visible {
  outline:3px solid var(--poster-ui-accent); outline-offset:4px;
}
button:disabled { opacity:.55; cursor:wait; }
[hidden] { display:none !important; }
.topbar {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:relative;
  padding:calc(24px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));
  background:var(--poster-card-bg); border-bottom:1px solid var(--poster-border);
}
.topbar > div:not(.topbar-badge) { flex:1 1 180px; min-width:0; }
.topbar-badge { flex:0 0 28px; width:28px; height:28px; background:var(--poster-ui-accent); border-radius:var(--poster-control-radius); }
.topbar h1 { margin:0; color:var(--poster-text); font:600 clamp(24px,4vw,40px)/1.04 var(--poster-display); letter-spacing:-.035em; overflow-wrap:normal; }
.topbar .sub { margin-top:8px; color:var(--poster-text-soft); font-size:13px; }
.upload-btn {
  min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 16px; margin-left:auto; border:1px solid transparent;
  border-radius:var(--poster-control-radius); background:var(--poster-ui-accent); color:var(--poster-on-accent);
  font:600 14px/1.3 var(--poster-sans); flex-shrink:0;
}

.customize-wrap { position:absolute; top:16px; right:max(16px,env(safe-area-inset-right)); z-index:1050; }

.customize-panel {

  width:280px; max-width:calc(100vw - 32px);

  border-radius:var(--poster-radius); padding:16px; color:var(--poster-text);

.customize-panel.open { display:block; }
.customize-title { font:700 20px/1 var(--poster-display); text-transform:uppercase; color:var(--poster-text); margin-bottom:14px; }
.customize-section-label { font:600 11px/1.4 var(--poster-mono); text-transform:uppercase; color:var(--poster-text-soft); margin:14px 0 8px; }
.customize-section-label:first-of-type { margin-top:0; }
.palette-swatches { display:flex; flex-wrap:wrap; gap:8px; }

  cursor:pointer; flex-shrink:0; position:relative;

.class-color-list { display:flex; flex-direction:column; gap:8px; }

@media (hover:hover) { .ccr-delete:not(.confirm):hover { color:#D92D20; border-color:#D92D20; } }

/* ---- Sync section in the Customize panel ---- */
.sync-code { font:500 22px/1.1 var(--poster-mono); letter-spacing:.06em; color:var(--poster-text); }
.sync-status { margin-top:4px; font-size:12px; color:var(--poster-text-soft); }

  border-radius:var(--poster-control-radius); background:var(--poster-bg); color:var(--poster-text);

}
.sync-join button {

}

.wrap { width:100%; max-width:1000px; margin:0 auto; padding:24px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left)); }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 20px; }
.filter-btn {
  display:inline-flex; align-items:center; gap:7px; min-height:44px;
  padding:9px 12px; border:1px solid var(--poster-border); border-radius:var(--poster-control-radius);
  background:var(--poster-card-bg); color:var(--poster-text-soft); font:600 13px/1.25 var(--poster-sans); max-width:100%; text-align:left;
}
.filter-btn .dot { width:8px; height:8px; border-radius:50%; flex:0 0 8px; }
/* Existing renderer sets active backgrounds inline. A neutral selection keeps

.filter-btn.active { background:var(--poster-text) !important; color:var(--poster-bg); border-color:var(--poster-text); }
.filter-btn[data-f="All"] .dot { display:none; }
.progress-wrap { padding:16px; margin-bottom:28px; border:1px solid var(--poster-border); border-radius:var(--poster-radius); background:var(--poster-card-bg); }
.progress-label { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; color:var(--poster-text-soft); font-size:13px; }
.progress-label b { color:var(--poster-text); font-weight:600; font-variant-numeric:tabular-nums; }
.progress-track { height:7px; border:0; border-radius:20px; overflow:hidden; background:var(--poster-track); }
.progress-fill { height:100%; border:0; border-radius:inherit; background:var(--poster-ui-accent); transition:width .2s ease; }
.timeline { position:relative; min-width:0; }
.date-row,.today-marker-row { display:flex; gap:12px; }
.date-rail,.today-marker-rail { width:12px; flex:0 0 12px; display:flex; flex-direction:column; align-items:center; }
.date-node { flex:0 0 9px; width:9px; height:9px; margin-top:9px; border:2px solid var(--poster-bg); border-radius:50%; background:var(--poster-ui-accent); }
.date-line,.today-marker-line { width:1px; flex:1; margin-top:8px; background:var(--poster-border); }
.date-row:last-child .date-line { background:transparent; }
.date-content { flex:1; min-width:0; padding-bottom:24px; }
.date-heading { margin:0 0 12px; font:600 14px/1.6 var(--poster-sans); color:var(--poster-text); }
.card {
  min-width:0; margin:0 0 10px; padding:16px; cursor:pointer;
  border:1px solid var(--poster-border); border-left:3px solid var(--accent,var(--poster-ui-accent));
  border-radius:var(--poster-radius); background:var(--poster-card-bg); box-shadow:var(--poster-shadow);
}
.card-top { display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
.card-left { flex:1; min-width:0; }
/* An opaque label backing leaves a 4px stripe of the ORIGINAL inline class

.tag {
  display:inline-flex; align-items:center; position:relative; isolation:isolate;
  color:var(--poster-text); border:1px solid var(--poster-border); border-left:0;
  border-radius:3px; padding:3px 7px 3px 11px; margin-bottom:8px;
  font:600 11px/1.3 var(--poster-sans); max-width:100%; overflow-wrap:anywhere;
}
.tag::before { content:""; position:absolute; z-index:-1; inset:0 0 0 4px; background:var(--poster-card-bg); border-radius:0 2px 2px 0; }
.title { font:600 17px/1.3 var(--poster-sans); color:var(--poster-text); letter-spacing:-.018em; }

.pill { display:inline-flex; border:1px solid var(--poster-border); border-radius:20px; padding:3px 8px; color:var(--poster-text-soft); font:400 11px/1.3 var(--poster-sans); }
.pill.on.complete { color:var(--poster-done); background:var(--poster-done-bg); border-color:transparent; }
.pill.on.turned { color:var(--poster-turned); background:var(--poster-turned-bg); border-color:transparent; }
.details { display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--poster-border); font-size:14px; line-height:1.6; color:var(--poster-text-soft); }

.action-btn { flex:1 1 130px; min-height:44px; border:1px solid var(--poster-border); border-radius:var(--poster-control-radius); padding:10px; background:var(--poster-card-bg); color:var(--poster-text); font:600 13px/1.3 var(--poster-sans); }
.action-btn.complete.on { color:var(--poster-done); background:var(--poster-done-bg); border-color:var(--poster-done); }
.action-btn.turned.on { color:var(--poster-turned); background:var(--poster-turned-bg); border-color:var(--poster-turned); }

.today-chip { display:inline-block; margin-left:8px; padding:3px 8px; border-radius:var(--poster-control-radius); background:var(--poster-ui-accent); color:var(--poster-on-accent); font:600 11px/1.3 var(--poster-sans); vertical-align:middle; }
.today-marker-node { width:12px; height:12px; flex:0 0 12px; margin-top:5px; border-radius:50%; background:var(--poster-ui-accent); animation:none; }
.today-marker-content { flex:1; min-width:0; padding:0 0 24px; }
.today-marker-label { display:flex; align-items:center; gap:12px; width:100%; color:var(--poster-text); font:600 13px/1.5 var(--poster-sans); }
.today-marker-label::after { content:""; flex:1; min-width:12px; height:1px; background:var(--poster-ui-accent); }
canvas#confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:999; }
.modal-overlay { display:none; position:fixed; inset:0; z-index:1000; align-items:center; justify-content:center; padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); background:var(--poster-scrim); }
.modal-overlay.open { display:flex; }
.modal { width:100%; max-width:560px; max-height:85vh; max-height:85dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--poster-card-bg); border:1px solid var(--poster-border); color:var(--poster-text); padding:24px; border-radius:var(--poster-radius); box-shadow:var(--poster-shadow); }

.modal-btn.primary { background:var(--poster-ui-accent); color:var(--poster-on-accent); border-color:transparent; }

/* The deadline is the poster: square corners, oversized type, deliberate hard edges. */
:root { --poster-radius:0px; --poster-control-radius:0px; --poster-shadow:4px 4px 0 var(--poster-border); }
.topbar { align-items:flex-end; background:var(--poster-ui-accent); color:var(--poster-on-accent); border-bottom:3px solid var(--poster-border); gap:16px; padding-top:calc(24px + env(safe-area-inset-top)); }
.topbar-badge { display:none; }
.topbar h1 { color:var(--poster-on-accent); font:800 56px/.88 var(--poster-display); text-transform:uppercase; max-width:12ch; letter-spacing:-.015em; }
.topbar .sub { color:var(--poster-on-accent); font:500 11px/1.4 var(--poster-mono); text-transform:uppercase; }
.upload-btn { background:var(--poster-on-accent); color:var(--poster-ui-accent); border:2px solid var(--poster-on-accent); box-shadow:none; font-weight:700; }
.wrap { max-width:1240px; padding-top:24px; }
.filters { gap:8px; }
.filter-btn { border-width:2px; font-size:12px; font-weight:700; text-transform:uppercase; }
.filter-btn.active { box-shadow:3px 3px 0 var(--poster-border); }
.filter-btn .dot { border-radius:0; }
.progress-wrap { border:0; border-bottom:3px solid var(--poster-border); padding:0 0 18px; border-radius:0; background:transparent; margin-bottom:24px; }
.progress-label { font:500 12px/1.4 var(--poster-mono); text-transform:uppercase; }
.progress-label b { font:800 38px/.9 var(--poster-display); }
.progress-track { height:12px; border-radius:0; }
.progress-fill { background:var(--poster-text); }
.date-rail,.today-marker-rail { display:none; }
.date-heading { font:700 29px/1 var(--poster-display); text-transform:uppercase; border-top:3px solid var(--poster-border); padding-top:10px; margin-bottom:16px; }
.date-content { padding-bottom:24px; }
.card { border:2px solid var(--poster-border); box-shadow:var(--poster-shadow); padding:16px; margin:0 4px 18px 0; }
.tag { border-color:var(--poster-border); border-radius:0; font:600 11px/1.25 var(--poster-mono); text-transform:uppercase; }
.tag::before { border-radius:0; }
.title { font:700 29px/.98 var(--poster-display); text-transform:uppercase; letter-spacing:.005em; }
.time { font:400 11px/1.5 var(--poster-mono); }
.pill { border-radius:0; font:400 11px/1.3 var(--poster-mono); }
.today-marker-label { font:700 17px/1.3 var(--poster-sans); text-transform:uppercase; }
.today-marker-label::after { height:3px; background:var(--poster-text); }
.action-btn { border-width:2px; font:600 12px/1.2 var(--poster-sans); text-transform:uppercase; }
.today-chip { background:var(--poster-text); color:var(--poster-bg); }
.completed-section { padding-left:0; }
.completed-toggle { border-top-width:3px; text-transform:uppercase; font-size:13px; }
.modal h2 { font:700 36px/1 var(--poster-display); text-transform:uppercase; }
@media (min-width:900px) {
  .topbar { padding:40px max(32px,calc((100% - 1176px)/2)) 32px; }
  .topbar h1 { font-size:96px; max-width:12ch; }
  .topbar .sub { font-size:12px; }
  .wrap { padding-top:32px; }
  .date-heading { font-size:38px; }
  .card { padding:24px; }
  .title { font-size:40px; }
}
@media (max-width:380px) {
  .topbar h1 { font-size:44px; }
}


/* Header color is independent of assignment class colors. */
:root {
  --poster-header-day:#2459F6;
  --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#A2BEFF;
  --poster-header-night-ink:#171914;
  --poster-header-fill:var(--poster-header-day);
  --poster-header-ink:var(--poster-header-day-ink);
}
:root[data-palette="blue"] {
  --poster-header-day:#2459F6; --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#A2BEFF; --poster-header-night-ink:#171914;
}
:root[data-palette="violet"] {
  --poster-header-day:#7447DB; --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#C1A3FF; --poster-header-night-ink:#171914;
}
:root[data-palette="orange"] {
  --poster-header-day:#FF822E; --poster-header-day-ink:#171914;
  --poster-header-night:#FFB98A; --poster-header-night-ink:#171914;
}
:root[data-palette="teal"] {
  --poster-header-day:#08766B; --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#79DAC6; --poster-header-night-ink:#171914;
}
:root[data-palette="blue-peach"] {
  --poster-header-day:#2347A4; --poster-header-day-ink:#FFFFFF;
  --poster-header-night:#FFAC77; --poster-header-night-ink:#171914;
}

:root[data-theme="dark"] {
  --poster-header-fill:var(--poster-header-night);
  --poster-header-ink:var(--poster-header-night-ink);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --poster-header-fill:var(--poster-header-night);
    --poster-header-ink:var(--poster-header-night-ink);
  }
}
/* This override comes last, so it also covers explicit and system dark mode. */
:root[data-header-mode="fixed"] {
  --poster-header-fill:var(--poster-header-day);
  --poster-header-ink:var(--poster-header-day-ink);
}

/* Explicit light mode wins over device and containing-app appearance. */
:root[data-theme="light"] {
  color-scheme:only light;
  --poster-bg:#ffffff;
  --poster-card-bg:#ffffff;
  --poster-text:#171914;
  --poster-text-soft:#616161;
  --poster-border:#171914;
  --poster-track:#e9e9e9;
  --poster-accent-soft:#f2f2f2;
  --poster-header-fill:var(--poster-header-day);
  --poster-header-ink:var(--poster-header-day-ink);
}
:root[data-theme="light"] body {
  color-scheme:only light;
  background-color:#ffffff !important;
  color:#171914;
}
:root[data-theme="light"] .wrap,
:root[data-theme="light"] .timeline,
:root[data-theme="light"] .date-content,
:root[data-theme="light"] .card,
:root[data-theme="light"] .completed-section,
:root[data-theme="light"] .completed-list,
:root[data-theme="light"] .modal {
  background-color:#ffffff;
}
/* ---- To Do / Done pages (poster style) ---- */
.view-tabs { display:flex; gap:0; margin:0 0 20px; border:3px solid var(--poster-border); border-radius:var(--poster-radius); overflow:hidden; }
.view-tab {
  flex:1; min-height:48px; border:0; background:var(--poster-card-bg); color:var(--poster-text);
  font:700 22px/1 var(--poster-display); text-transform:uppercase; letter-spacing:.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
}
.view-tab + .view-tab { border-left:3px solid var(--poster-border); }
.view-tab.active { background:var(--poster-ui-accent); color:var(--poster-on-accent); }
.view-tab .count { font:600 11px/1 var(--poster-mono); padding:4px 7px; border:2px solid currentColor; border-radius:20px; }
.done-view .card { opacity:.8; }

/* ---- Lighter type ---- */
.topbar h1, .date-heading, .title, .view-tab, .empty-state-title, .customize-title { font-weight:500; }
.upload-btn, .filter-btn, .action-btn, .modal-btn, .today-chip, .today-marker-label,
.completed-toggle, .undo-btn, .progress-label b { font-weight:500; }
.tag { font-weight:500; }
.pill.on.complete, .pill.on.turned { font-weight:500; }

/* ---- Past due ---- */
:root { --poster-overdue:#D92D20; --poster-overdue-ink:#FFFFFF; }
.card.overdue { border-color:var(--poster-overdue); box-shadow:4px 4px 0 var(--poster-overdue); }
.pill.overdue {
  order:-1; color:var(--poster-overdue-ink); background:var(--poster-overdue);
  border-color:var(--poster-overdue); font-weight:600; text-transform:uppercase; letter-spacing:.04em;
}

/* ---- Bigger "Today" ---- */
.today-chip {
  margin-left:12px; padding:5px 12px 4px; vertical-align:.18em;
  font:500 20px/1 var(--poster-display); text-transform:uppercase; letter-spacing:.02em;
}
.today-marker-label { font:500 26px/1.1 var(--poster-display); }
.date-heading.is-today { font-size:44px; line-height:1; border-top-width:6px; }
@media (min-width:900px) {
  .date-heading.is-today { font-size:96px; line-height:.95; border-top-width:8px; padding-top:14px; }
  .today-chip { font-size:40px; padding:8px 18px 6px; margin-left:18px; }
  .today-marker-label { font-size:52px; }
}
</style>
</head>

  {id:"th3", date:"2026-09-17", class:"Thesis 1", title:"1st Prototype", time:"in class", desc:"First prototype due for internal playtest."},
  {id:"aes2", date:"2026-09-22", class:"Aesthetics", title:"Response Paper #2: Hegel and Classical Art", time:"10am", desc:"300-word response + discussion question on classical art / Hegel reading."},

  {id:"da4", date:"2026-09-30", class:"Digital Addiction", title:"Assignment 4: Participant Observation", time:"in class", desc:"Observe digital-device use in a public place for 30-40 min. Submit a 300-500 word fieldnote-based reflection."},
  {id:"th4", date:"2026-10-01", class:"Thesis 1", title:"2nd Prototype", time:"in class", desc:"Second prototype due, playtest with other Games section."},

  {id:"da8", date:"2026-11-11", class:"Digital Addiction", title:"Assignment 8: Host a Party Like It's 1996", time:"before class", desc:"Host a gathering without digital devices. No streaming music, no delivery apps. Take photos on disposable camera, write a 300-500 word reflection."},

];

const defaultAssignments = assignments;

const knownClassColors = {
  "Visual Merchandising": "#ea4335",
  "Aesthetics": "#a142f4",
  "Digital Addiction": "#12b5cb",
  "Thesis 1": "#fbbc04"
};
const extraPalette = ["#e67c73","#33b679","#8e24aa","#3f51b5","#0b8043","#d50000","#f4511e","#039be5","#c2185b","#00897b"];
let classColorOverrides = {};
try { classColorOverrides = JSON.parse(localStorage.getItem("classColorOverrides") || "{}"); } catch(e) { classColorOverrides = {}; }
function saveClassColorOverrides() { try { localStorage.setItem("classColorOverrides", JSON.stringify(classColorOverrides)); } catch(e) {} }
function getClassColor(cls) {
  if (classColorOverrides[cls]) return classColorOverrides[cls];
  if (knownClassColors[cls]) return knownClassColors[cls];
  let hash = 0;
  for (let i = 0; i < cls.length; i++) hash = cls.charCodeAt(i) + ((hash << 5) - hash);
  return extraPalette[Math.abs(hash) % extraPalette.length];
}

let customAssignments = [];
try { customAssignments = JSON.parse(localStorage.getItem("customAssignments") || "[]"); } catch(e) { customAssignments = []; }
function saveCustomAssignments() { try { localStorage.setItem("customAssignments", JSON.stringify(customAssignments)); } catch(e) {} }
// Deleted classes: { "Class name": timeDeleted }. Assignments in that class
// that existed before it was deleted are hidden everywhere; if you add the same
// class again later from a syllabus, the new ones show up normally.
let removedClasses = {};
try { removedClasses = JSON.parse(localStorage.getItem("removedClasses") || "{}"); } catch(e) { removedClasses = {}; }
function saveRemovedClasses() { try { localStorage.setItem("removedClasses", JSON.stringify(removedClasses)); } catch(e) {} }
function createdAt(a) { const m = /^custom-(\d+)/.exec(a.id || ""); return m ? Number(m[1]) : 0; }
function isRemoved(a) { const t = removedClasses[a.class]; return !!t && createdAt(a) < t; }
function pruneRemoved() {
  const before = customAssignments.length;
  customAssignments = customAssignments.filter(a => !isRemoved(a));
  if (customAssignments.length !== before) saveCustomAssignments();
}
pruneRemoved();

function deleteClass(cls) {
  removedClasses[cls] = Date.now();
  saveRemovedClasses();
  pruneRemoved();
  delete classColorOverrides[cls];
  saveClassColorOverrides();
  if (activeFilter === cls) activeFilter = "All";
  scheduleSync();
  render();
  renderCustomizePanel();
}

function getAllAssignments() { return [...defaultAssignments, ...customAssignments].filter(a => !isRemoved(a)); }
function getAllClasses() { return [...new Set(getAllAssignments().map(a => a.class))]; }

// state[id] = { complete, turned, t }  — t is when it last changed, so syncing
// between devices keeps whichever change is newest.
let state = {};
try { state = JSON.parse(localStorage.getItem("assignmentState") || "{}"); } catch(e) { state = {}; }
function saveState() { try { localStorage.setItem("assignmentState", JSON.stringify(state)); } catch(e) {} }

// When colours / header palette last changed (for syncing those too)
let prefsT = 0;
try { prefsT = parseInt(localStorage.getItem("prefsUpdatedAt") || "0", 10) || 0; } catch(e) { prefsT = 0; }
function touchPrefs() { prefsT = Date.now(); try { localStorage.setItem("prefsUpdatedAt", String(prefsT)); } catch(e) {} }

// Ask the browser to treat saved progress as persistent so it isn't cleared to free up space
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

let activeFilter = "All";
let openId = null;
let activeView = "todo";
const lingering = new Set(); // just-finished items stay visible for a moment before moving

// An assignment moves to the Done page once it's BOTH marked complete AND turned in
function isFinished(a) { const s = state[a.id] || {}; return !!(s.complete && s.turned); }

document.querySelectorAll(".view-tab").forEach(tab => {
  tab.onclick = () => { activeView = tab.dataset.view; openId = null; render(); window.scrollTo({ top: 0 }); };
});

function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

function getTodayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function todayMarkerHTML() {
  const label = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  return `
    <div class="today-marker-row">
      <div class="today-marker-rail">
        <div class="today-marker-node"></div>
        <div class="today-marker-line"></div>
      </div>
      <div class="today-marker-content">
        <div class="today-marker-label">Today — ${label}</div>
      </div>
    </div>
  `;
}

function render() {
  const allAssignments = getAllAssignments();
  const classes = getAllClasses();
  const filters = ["All", ...classes];
  const filterEl = document.getElementById("filters");
  filterEl.innerHTML = filters.map(f => {
    const color = f === "All" ? "#1a73e8" : getClassColor(f);
    const active = f === activeFilter;
    return `<button class="filter-btn ${active?'active':''}" data-f="${f}" style="${active ? `background:${color};` : ''}">
      <span class="dot" style="background:${color}"></span>${f}
    </button>`;
  }).join("");
  filterEl.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => { activeFilter = btn.dataset.f; render(); };
  });

  const classFiltered = activeFilter === "All" ? allAssignments : allAssignments.filter(a => a.class === activeFilter);
  const total = classFiltered.length;
  const doneCount = classFiltered.filter(isFinished).length;
  const pct = total ? Math.round((doneCount/total)*100) : 0;
  document.getElementById("progressText").textContent = `${doneCount} of ${total} done & turned in`;

  document.getElementById("todoCount").textContent = total - doneCount;
  document.getElementById("doneCount").textContent = doneCount;
  document.querySelectorAll(".view-tab").forEach(t => t.classList.toggle("active", t.dataset.view === activeView));

  const isDoneView = activeView === "done";
  const filtered = classFiltered.filter(a => isDoneView ? (isFinished(a) && !lingering.has(a.id)) : (!isFinished(a) || lingering.has(a.id)));
  document.getElementById("progressPct").textContent = `${pct}%`;
  document.getElementById("progressFill").style.width = pct + "%";

  const grouped = {};
  filtered.forEach(a => { (grouped[a.date] ||= []).push(a); });
  // To Do: oldest due date first. Done: most recent first.
  const dates = Object.keys(grouped).sort();
  if (isDoneView) dates.reverse();
  const todayStr = getTodayStr();

  const listEl = document.getElementById("list");
  listEl.classList.toggle("done-view", isDoneView);
  let html = "";
  let todayPlaced = isDoneView; // no Today marker on the Done page

  dates.forEach((date, i) => {
    if (!todayPlaced && date > todayStr) {
      html += todayMarkerHTML();
      todayPlaced = true;
    }
    const isToday = date === todayStr;
    if (isToday) todayPlaced = true;

    const items = grouped[date].map(a => {
      const s = state[a.id] || {};
      const isOpen = openId === a.id;
      // Past due = its date is before today and it isn't both done and turned in
      const overdue = a.date < todayStr && !isFinished(a);
      return `
        <div class="card ${overdue ? 'overdue' : ''}" data-id="${a.id}" style="--accent:${getClassColor(a.class)}">
          <div class="card-top">
            <div class="card-left">
              <span class="tag" style="background:${getClassColor(a.class)}">${a.class}</span>
              <div class="title">${a.title}</div>
              <div class="time">${a.time}</div>
            </div>
            <div class="status-pills">
              ${overdue ? '<span class="pill overdue">Past due</span>' : ''}
              <span class="pill ${s.complete?'on complete':''}">${s.complete?'Complete':'Not done'}</span>
              <span class="pill ${s.turned?'on turned':''}">${s.turned?'Turned in':'Not submitted'}</span>
            </div>
          </div>
          <div class="details ${isOpen?'open':''}">
            <div>${a.desc}</div>
            <div class="actions">
              <button class="action-btn complete ${s.complete?'on':''}" data-action="complete" data-id="${a.id}">${s.complete ? 'Marked Complete' : 'Mark Complete'}</button>
              <button class="action-btn turned ${s.turned?'on':''}" data-action="turned" data-id="${a.id}">${s.turned ? 'Marked Turned In' : 'Mark Turned In'}</button>
            </div>
          </div>
        </div>
      `;
    }).join("");

    const isLast = i === dates.length - 1;
    const nodeColor = getClassColor(grouped[date][0].class);
    html += `
      <div class="date-row" ${isLast && todayPlaced ? 'style="padding-bottom:0"' : ''}>
        <div class="date-rail">
          <div class="date-node ${isToday ? 'is-today' : ''}" style="${isToday ? '' : `background:${nodeColor};box-shadow:0 0 0 1.5px ${nodeColor}`}"></div>
          <div class="date-line"></div>
        </div>
        <div class="date-content">
          <div class="date-heading ${isToday ? 'is-today' : ''}">${fmtDate(date)}${isToday ? '<span class="today-chip">Today</span>' : ''}</div>
          ${items}
        </div>
      </div>
    `;
  });

  if (!todayPlaced) html += todayMarkerHTML();

  if (dates.length === 0) {
    html = isDoneView
      ? `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-title">Nothing here yet</div><div class="empty-state-text">Assignments land here once they're marked complete and turned in.</div></div>`
      : `<div class="empty-state"><div class="empty-state-icon">🎉</div><div class="empty-state-title">All caught up</div><div class="empty-state-text">Everything${activeFilter === "All" ? "" : " for " + activeFilter} is done and turned in.</div></div>`;
  }

  listEl.innerHTML = html;

  listEl.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", (e) => {
      if (e.target.dataset.action) return;
      const id = card.dataset.id;
      openId = openId === id ? null : id;
      render();
    });
  });
  listEl.querySelectorAll(".action-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (!state[id]) state[id] = {};
      const turningOn = !state[id][action];
      state[id][action] = turningOn;
      state[id].t = Date.now();
      saveState();
      scheduleSync();
      const a = getAllAssignments().find(x => x.id === id);
      if (turningOn && a && isFinished(a)) {
        launchConfetti();
        // brief pause so you see it get checked off before it moves to Done
        lingering.add(id);
        render();
        setTimeout(() => { lingering.delete(id); if (openId === id) openId = null; render(); }, 900);
        return;
      }
      if (action === "turned" && turningOn) launchConfetti();
      render();
    });
  });

  // Keep the Customize panel in sync, but don't rebuild it while it's open
  // (that would close the colour picker mid-drag).
  if (!document.getElementById("customizePanel").classList.contains("open")) renderCustomizePanel();
}

/* ---- customize: header palette + per-class colors ---- */

// Each palette's light/dark header fill + readable text color on top of it.
const PALETTE_OPTIONS = [
  { id: "red", label: "Red", light: "#E5383B", lightInk: "#FFFFFF", dark: "#FF9B9B", darkInk: "#171914" },
  { id: "orange", label: "Orange", light: "#FF822E", lightInk: "#171914", dark: "#FFB98A", darkInk: "#171914" },
  { id: "amber", label: "Amber", light: "#E8A400", lightInk: "#171914", dark: "#FFE08A", darkInk: "#171914" },
  { id: "green", label: "Green", light: "#1E8E3E", lightInk: "#FFFFFF", dark: "#9FE6B3", darkInk: "#171914" },
  { id: "teal", label: "Teal", light: "#08766B", lightInk: "#FFFFFF", dark: "#79DAC6", darkInk: "#171914" },
  { id: "blue", label: "Blue", light: "#2459F6", lightInk: "#FFFFFF", dark: "#A2BEFF", darkInk: "#171914" },
  { id: "violet", label: "Violet", light: "#7447DB", lightInk: "#FFFFFF", dark: "#C1A3FF", darkInk: "#171914" },
  { id: "pink", label: "Pink", light: "#D6336C", lightInk: "#FFFFFF", dark: "#FFB3D1", darkInk: "#171914" }
];

function getSavedPaletteId() {
  try { return localStorage.getItem("posterPalette") || "blue"; } catch(e) { return "blue"; }
}
function savePaletteId(id) {
  try { localStorage.setItem("posterPalette", id); } catch(e) {}
}

// Set the actual header colors as inline custom properties on <html>.
// Inline style beats every stylesheet rule regardless of selector specificity,
// so this is guaranteed to take effect no matter what else the CSS does.
function applyPalette(id) {
  const opt = PALETTE_OPTIONS.find(p => p.id === id) || PALETTE_OPTIONS[0];
  const root = document.documentElement.style;
  root.setProperty("--poster-header-day", opt.light);
  root.setProperty("--poster-header-day-ink", opt.lightInk);
  root.setProperty("--poster-header-night", opt.dark);
  root.setProperty("--poster-header-night-ink", opt.darkInk);
  document.documentElement.dataset.palette = id;
  // Saved so the <head> script can paint the right header before anything loads
  try { localStorage.setItem("posterPaletteVars", JSON.stringify([opt.light, opt.lightInk, opt.dark, opt.darkInk])); } catch(e) {}
}

let currentPaletteId = getSavedPaletteId();
applyPalette(currentPaletteId);

// Colours picked before sync existed have no timestamp, so they'd never be
// uploaded. Give them the oldest possible one: they get shared, but any real
// change made on another device still wins.
(function seedOldPrefs() {
  let hadPalette = false;
  try { hadPalette = !!localStorage.getItem("posterPalette"); } catch(e) {}
  if (prefsT === 0 && (hadPalette || Object.keys(classColorOverrides).length)) {
    prefsT = 1;
    try { localStorage.setItem("prefsUpdatedAt", "1"); } catch(e) {}
  }
})();

function renderCustomizePanel() {
  const swatchesEl = document.getElementById("paletteSwatches");
  swatchesEl.innerHTML = PALETTE_OPTIONS.map(p => `
    <button class="palette-swatch ${p.id === currentPaletteId ? 'selected' : ''}"
      style="background:${p.light}" data-palette-id="${p.id}"
      aria-label="${p.label}" title="${p.label}"></button>
  `).join("");
  swatchesEl.querySelectorAll(".palette-swatch").forEach(btn => {
    btn.addEventListener("click", () => {
      currentPaletteId = btn.dataset.paletteId;
      applyPalette(currentPaletteId);
      savePaletteId(currentPaletteId);
      touchPrefs();
      scheduleSync();
      renderCustomizePanel();
    });
  });

  const classes = getAllClasses();
  const listEl = document.getElementById("classColorList");
  if (classes.length === 0) {
    listEl.innerHTML = `<div class="class-color-empty">Add a syllabus to add a class.</div>`;
    return;
  }
  listEl.innerHTML = classes.map(cls => {
    const safe = cls.replace(/"/g, '&quot;');
    return `
    <div class="class-color-row">
      <span class="ccr-name">${cls}</span>
      <input type="color" value="${getClassColor(cls)}" data-class="${safe}" aria-label="Color for ${safe}">
      <button class="ccr-delete" data-class="${safe}" aria-label="Delete ${safe}" title="Delete class">✕</button>
    </div>`;
  }).join("");
  // Two taps to delete: first tap asks, second tap within 4s deletes.
  listEl.querySelectorAll(".ccr-delete").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("confirm")) { deleteClass(btn.dataset.class); return; }
      const count = getAllAssignments().filter(a => a.class === btn.dataset.class).length;
      btn.classList.add("confirm");
      btn.textContent = `Delete ${count}?`;
      setTimeout(() => { if (btn.isConnected) { btn.classList.remove("confirm"); btn.textContent = "✕"; } }, 4000);
    });
  });
  listEl.querySelectorAll('input[type="color"]').forEach(input => {
    input.addEventListener("input", () => {
      classColorOverrides[input.dataset.class] = input.value;
      saveClassColorOverrides();
      touchPrefs();
      scheduleSync();
      render();
    });
  });
}

const hamburgerBtn = document.getElementById("hamburgerBtn");
const customizePanel = document.getElementById("customizePanel");
hamburgerBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const isOpen = customizePanel.classList.toggle("open");
  if (isOpen) renderCustomizePanel();
  hamburgerBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
});
// Clicks inside the panel (like picking a swatch) shouldn't close it
customizePanel.addEventListener("click", (e) => e.stopPropagation());
document.addEventListener("click", (e) => {
  if (!customizePanel.contains(e.target) && e.target !== hamburgerBtn) {
    customizePanel.classList.remove("open");
    hamburgerBtn.setAttribute("aria-expanded", "false");
  }
});

/* ---- cloud sync ----
   Progress is saved on this device AND in the cloud. Every device that opens
   this link shares the same built-in key, so they all show the same thing —
   no code to enter. */

// Replace with your deployed sync Worker URL, e.g.
// "https://coursely-sync.yourname.workers.dev"
const SYNC_URL = "https://checklist.tavan388.workers.dev/sync";
// One shared key for everyone who opens this link (must look like XXXX-XXXX).
const SYNC_KEY = "NICK-MAIN";
const LIVE_REFRESH_MS = 20000; // check for changes from other devices every 20s

const syncStatusEl = document.getElementById("syncStatus");

function setSyncStatus(msg, isError) {
  syncStatusEl.textContent = msg;
  syncStatusEl.classList.toggle("error", !!isError);
}

function syncConfigured() { return SYNC_URL && SYNC_URL !== "PASTE_YOUR_SYNC_WORKER_URL_HERE"; }

function localBundle() {
  return { state, customAssignments, classColorOverrides, palette: currentPaletteId, prefsT, removedClasses };
}

// Newest change per assignment wins; custom assignments are combined;
// newest colour settings win. Returns true if anything changed locally.
function mergeRemote(remote) {
  if (!remote) return false;
  let changed = false;
  // Classes deleted on another device (keep the most recent deletion time)
  for (const [cls, t] of Object.entries(remote.removedClasses || {})) {
    if ((t || 0) > (removedClasses[cls] || 0)) {
      removedClasses[cls] = t; changed = true;
      if (activeFilter === cls) activeFilter = "All";
    }
  }
  if (changed) saveRemovedClasses();
  for (const [id, r] of Object.entries(remote.state || {})) {
    const l = state[id];
    if (!l || (r.t || 0) > (l.t || 0)) { state[id] = r; changed = true; }
  }
  const ids = new Set(customAssignments.map(a => a.id));
  (remote.customAssignments || []).forEach(a => {
    if (a && a.id && !ids.has(a.id) && !isRemoved(a)) { customAssignments.push(a); ids.add(a.id); changed = true; }
  });
  pruneRemoved();
  if ((remote.prefsT || 0) > prefsT) {
    classColorOverrides = remote.classColorOverrides || {};
    if (remote.palette) { currentPaletteId = remote.palette; applyPalette(currentPaletteId); savePaletteId(currentPaletteId); }
    prefsT = remote.prefsT;
    try { localStorage.setItem("prefsUpdatedAt", String(prefsT)); } catch(e) {}
    saveClassColorOverrides();
    changed = true;
  }
  if (changed) { saveState(); saveCustomAssignments(); }
  return changed;
}

let syncing = false, syncAgain = false, syncTimer = null;

async function syncNow() {
  if (!syncConfigured()) { setSyncStatus("Cloud sync not set up yet — saving on this device only."); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  setSyncStatus("Syncing…");
  try {
    // POST sends our changes; the server merges and returns everything.
    const resp = await fetch(`${SYNC_URL}?code=${encodeURIComponent(SYNC_KEY)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(localBundle())
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || "Sync failed");
    if (mergeRemote(data)) render();
    setSyncStatus("Synced " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
  } catch (e) {
    setSyncStatus("Offline — saved on this device, will sync later.", true);
  }
  syncing = false;
  if (syncAgain) { syncAgain = false; syncNow(); }
}

function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 600);
}

// While the app is on screen, quietly check for changes from other devices
setInterval(() => { if (document.visibilityState === "visible") syncNow(); }, LIVE_REFRESH_MS);

// Pull the latest whenever the app is opened or brought back to the front
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("focus", () => syncNow());
// Another tab of this same browser changed something
window.addEventListener("storage", (e) => {
  if (e.key === "assignmentState") {
    try { state = JSON.parse(e.newValue || "{}"); } catch(err) {}
    render();
  }
});

render();
syncNow();

/* ---- confetti ---- */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

const confettiColors = ["#ea4335", "#a142f4", "#12b5cb", "#fbbc04", "#1e8e3e", "#1a73e8"];
let particles = [];
let animId = null;

function launchConfetti() {
  const originX = window.innerWidth / 2;
  const originY = window.innerHeight * 0.25;
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: originX + (Math.random() - 0.5) * 60,
      y: originY,
      vx: (Math.random() - 0.5) * 9,
      vy: Math.random() * -8 - 4,
      size: Math.random() * 6 + 4,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 14,
      shape: Math.random() > 0.5 ? "rect" : "circle",
      life: 0
    });
  }
  if (!animId) animId = requestAnimationFrame(tick);
}

function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.vy += 0.28;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vrot;
    p.life++;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color;
    if (p.shape === "rect") {
      ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.66);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size/2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
  particles = particles.filter(p => p.y < canvas.height + 40 && p.life < 240);
  if (particles.length > 0) {
    animId = requestAnimationFrame(tick);
  } else {
    animId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

/* ---- syllabus upload ---- */

// Replace this with your deployed Cloudflare Worker URL, e.g.
// "https://syllabus-parser.yourname.workers.dev"
const WORKER_URL = "https://checklist.tavan388.workers.dev/parse";

const uploadModal = document.getElementById("uploadModal");
const syllabusInput = document.getElementById("syllabusInput");
const modalStatus = document.getElementById("modalStatus");
const previewList = document.getElementById("previewList");
const confirmActions = document.getElementById("confirmActions");
const parseBtn = document.getElementById("parseUploadBtn");
let pendingAssignments = [];

function openModal() {
  uploadModal.classList.add("open");
  syllabusInput.value = "";
  modalStatus.innerHTML = "";
  previewList.innerHTML = "";
  confirmActions.style.display = "none";
  pendingAssignments = [];
  parseBtn.style.display = "block";
}
function closeModal() { uploadModal.classList.remove("open"); }

document.getElementById("openUploadBtn").onclick = openModal;
document.getElementById("cancelUploadBtn").onclick = closeModal;
document.getElementById("discardPreviewBtn").onclick = closeModal;

parseBtn.onclick = async () => {
  const text = syllabusInput.value.trim();
  if (text.length < 30) {
    modalStatus.innerHTML = `<div class="modal-status error">Paste in more of the syllabus first.</div>`;
    return;
  }
  if (!WORKER_URL || WORKER_URL === "PASTE_YOUR_WORKER_URL_HERE") {
    modalStatus.innerHTML = `<div class="modal-status error">The AI backend isn't set up yet. Deploy the Worker and paste its URL into WORKER_URL in the code.</div>`;
    return;
  }
  modalStatus.innerHTML = `<div class="modal-status loading">Reading your syllabus...</div>`;
  parseBtn.disabled = true;

  try {
    const resp = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ syllabusText: text })
    });
    const data = await resp.json();
    if (!resp.ok || data.error) {
      modalStatus.innerHTML = `<div class="modal-status error">${data.error || "Something went wrong."}</div>`;
      parseBtn.disabled = false;
      return;
    }
    pendingAssignments = data.assignments || [];
    if (pendingAssignments.length === 0) {
      modalStatus.innerHTML = `<div class="modal-status error">No assignments found. Try pasting more of the syllabus.</div>`;
      parseBtn.disabled = false;
      return;
    }
    modalStatus.innerHTML = `<div class="modal-status">Found ${pendingAssignments.length} assignments. Uncheck any you don't want, then add.</div>`;
    previewList.innerHTML = pendingAssignments.map((a, i) => `
      <div class="preview-item">
        <input type="checkbox" checked data-idx="${i}" id="pi-${i}">
        <label for="pi-${i}">
          <div class="pi-title">${a.title}</div>
          <div class="pi-meta">${a.class} · ${a.date} · ${a.time || ""}</div>
        </label>
      </div>
    `).join("");
    confirmActions.style.display = "flex";
    parseBtn.style.display = "none";
  } catch (e) {
    modalStatus.innerHTML = `<div class="modal-status error">Couldn't reach the AI backend. Check your Worker URL and that it's deployed.</div>`;
  }
  parseBtn.disabled = false;
};

document.getElementById("addPreviewBtn").onclick = () => {
  const checked = [...previewList.querySelectorAll("input[type=checkbox]:checked")]
    .map(cb => parseInt(cb.dataset.idx));
  const toAdd = pendingAssignments
    .filter((a, i) => checked.includes(i))
    .map((a, i) => ({ desc: "", time: "", ...a, id: "custom-" + Date.now() + "-" + i }));
  customAssignments = [...customAssignments, ...toAdd];
  saveCustomAssignments();
  scheduleSync();
  closeModal();
  render();
};

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
