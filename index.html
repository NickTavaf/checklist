function markChip(it, withDesc, open) {
  return `<div class="smark${it.done ? " is-done" : ""}${it.event ? " is-event" : ""}" style="--mc:${it.color}" data-id="${sEsc(it.id)}" role="button" tabindex="0" aria-expanded="${open}" aria-label="${sEsc(it.title)}${it.done ? ", finished" : ""}">
    <span class="mt">${sEsc(it.title)}<span class="mtime">${[it.cls, it.time].filter(Boolean).map(sEsc).join(" · ")}</span>${withDesc && it.desc ? `<span class="mdesc">${sEsc(it.desc)}</span>` : ""}</span>
  </div>`;
}

function dayBoxHTML(key, items, opts) {
  const d = sParse(key);
  const today = key === getTodayStr();
  const out = opts.month && d.getMonth() !== opts.month.getMonth();
  const tag = "div";
  const dow = opts.long ? DOW[(d.getDay()+6)%7] : DOW[(d.getDay()+6)%7].slice(0,3);
  const num = opts.long ? d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : d.getDate();
  const list = items || [];
  const hol = holidayOn(key);
  const shown = list;
  return `<${tag} class="sday${today ? " is-today" : ""}${out ? " is-out" : ""}" data-date="${key}"${opts.month ? ` role="button" tabindex="0" aria-label="${fmtDate(key)}, ${list.length} item${list.length === 1 ? "" : "s"}${hol ? ", " + hol : ""}"` : ""}>
    <div class="sday-head">${opts.month ? `<span class="sday-num">${d.getDate()}${hol ? `<span class="shol-star" aria-hidden="true">★</span>` : ""}</span>${hol ? `<span class="shol shol-inline" title="${hol}">★ ${hol}</span>` : ""}` : `<span class="sday-dow">${today ? `<span class="tlabel">Today · </span>` : ""}${dow}</span><span class="sday-num">${num}</span>`}</div>
    ${hol ? `<div class="shol shol-line">★ ${hol}</div>` : ""}
    ${list.length ? `<div class="smarks">${shown.map(it => markHTML(it, opts.long)).join("")}</div>` : (opts.month ? "" : `<div class="sday-empty">Nothing due</div>`)}
    ${opts.long ? `<button type="button" class="sday-add" data-add="${key}">+ Add to this day</button>` : ""}
    ${opts.month ? `<span class="smore"></span>` : ""}
    ${opts.month && list.length ? `<div class="sdots">${list.map(it => `<span class="sdot" style="--mc:${it.color}"></span>`).join("")}</div>` : ""}
  </${tag}>`;
}

// Day view covers the whole term (plus a little either side) so you can keep scrolling.
function schedDayRange() {
  const dates = [...getAllAssignments().map(a => a.date), ...myEvents.map(e => e.date)].filter(Boolean).sort();
  let start = dates[0] || getTodayStr(), end = dates[dates.length-1] || getTodayStr();
  [getTodayStr(), sched.date].forEach(k => { if (k < start) start = k; if (k > end) end = k; });
  return [sAdd(start, -14), sAdd(end, 14)];
}

function openDay(key) { sched.view = "day"; sched.date = key; saveSchedPrefs(); renderSchedule(); }

// Size the calendar area so the view fills the rest of the screen exactly
function fitSchedule() {
  const body = document.getElementById("schedBody");
  if (!body || document.getElementById("page-schedule").hidden) return;
  const top = body.getBoundingClientRect().top + window.scrollY;
  body.style.height = Math.max(300, window.innerHeight - top - 12) + "px";
}
window.addEventListener("resize", fitSchedule);

// The Today button only lights up once you've moved away from today
function updateTodayBtn() {
  const t = getTodayStr(), d = sched.date;
  const here = sched.view === "week" ? sMonday(d) === sMonday(t) : sched.view === "month" ? d.slice(0,7) === t.slice(0,7) : d === t;
  document.getElementById("schedToday").disabled = here;
}

let schedObserver = null;
function renderSchedule() {
  const root = document.getElementById("schedBody");
  if (!root) return;
  fitSchedule();
  const items = schedItemsByDate();
  const title = document.getElementById("schedTitle");
  document.querySelectorAll("#schedViews button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === sched.view)));
  const tog = document.getElementById("schedToggle");
  tog.setAttribute("aria-checked", String(sched.showAssignments));
  if (schedObserver) { schedObserver.disconnect(); schedObserver = null; }
  updateTodayBtn();

  if (sched.view === "week") {
    const mon = sMonday(sched.date);
    const days = [...Array(7)].map((_, i) => sAdd(mon, i));
    const a = sParse(days[0]), b = sParse(days[6]);
    title.textContent = a.getMonth() === b.getMonth()
      ? `${a.toLocaleDateString("en-US",{month:"short"})} ${a.getDate()} – ${b.getDate()}`
      : `${a.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${b.toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
    root.innerHTML = `<div class="sweek">${days.map(k => dayBoxHTML(k, items[k], {})).join("")}</div>`;
    root.querySelectorAll(".sweek .sday").forEach(el => el.onclick = e => { if (!e.target.closest(".smark, .sopen, button")) openDay(el.dataset.date); });
  } else if (sched.view === "month") {
    const m = sParse(sched.date); m.setDate(1);
    title.textContent = m.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    const first = sMonday(sKey(m));
    const last = new Date(m.getFullYear(), m.getMonth()+1, 0);
    const cells = [];
    for (let k = first; ; k = sAdd(k, 1)) { cells.push(k); if (cells.length % 7 === 0 && sParse(k) >= last) break; }
    markHTML.inMonth = true;
    root.innerHTML = `<div class="smonth-dows">${DOW.map(d => `<span>${d.slice(0,3)}</span>`).join("")}</div>
      <div class="smonth" style="grid-template-rows:repeat(${cells.length / 7}, minmax(0,1fr))">${cells.map(k => dayBoxHTML(k, items[k], { month: m })).join("")}</div>`;
    markHTML.inMonth = false;
    // In Month, tapping anywhere in a day (markers included) opens that day
    root.querySelectorAll(".smonth .sday").forEach(el => {
      el.onclick = () => openDay(el.dataset.date);
      el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDay(el.dataset.date); } };
    });
    root.querySelectorAll(".smonth .smark").forEach(m => { m.removeAttribute("role"); m.removeAttribute("tabindex"); });
    // Show as many markers as fit in each box, then "+N more"
    root.querySelectorAll(".smonth .smarks").forEach(box => {
      const chips = [...box.children], more = box.parentElement.querySelector(".smore");
      let hidden = 0;
      // Only squeeze a day that's full: first move its holiday beside the date,
      // then shrink names to one line, then hide from the end
      const over = () => box.scrollHeight > box.clientHeight + 1;
      if (over() && box.parentElement.querySelector(".shol-line")) box.parentElement.classList.add("hol-in");
      if (over()) chips.forEach(c => c.classList.add("one-line"));
      while (chips.length - hidden > 0 && box.scrollHeight > box.clientHeight + 1) {
        chips[chips.length - 1 - hidden].hidden = true; hidden++;
        more.textContent = `+${hidden} more`;
      }
      // Never hide every marker: if only "+N more" would show, show the first one instead
      if (hidden && hidden === chips.length) { chips[0].hidden = false; more.textContent = hidden > 1 ? `+${hidden - 1} more` : ""; }
      // A two-line name that doesn't fit drops to one line
      chips.forEach(c => { if (!c.hidden && c.offsetTop + c.offsetHeight > box.offsetTop + box.clientHeight + 1) c.classList.add("one-line"); });
    });
  } else {
    const [start, end] = schedDayRange();
    const keys = []; for (let k = start; k <= end; k = sAdd(k, 1)) keys.push(k);
    root.innerHTML = `<div class="sdays" id="schedDays">${keys.map(k => dayBoxHTML(k, items[k], { long: true })).join("")}</div>
      <div class="sdays-hint">Scroll for the next day</div>`;
    const box = document.getElementById("schedDays");
    const target = box.querySelector(`[data-date="${sched.date}"]`);
    if (target) scrollBoxTo(box, target);
    const setTitle = k => { title.textContent = sParse(k).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); };
    setTitle(sched.date);
    schedObserver = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) { sched.date = en.target.dataset.date; setTitle(sched.date); updateTodayBtn(); } });
    }, { root: box, threshold: 0.6 });
    box.querySelectorAll(".sday").forEach(el => schedObserver.observe(el));
  }
}

// Scroll a box (sideways or down) so that one day sits at its start
function scrollBoxTo(box, el, smooth) {
  const b = box.getBoundingClientRect(), r = el.getBoundingClientRect();
  const x = box.scrollLeft + r.left - b.left;
  const y = box.scrollTop + r.top - b.top - 2;
  box.scrollTo({ left: x, top: y, behavior: smooth ? "smooth" : "auto" });
}

function schedStep(dir) {
  if (sched.view === "week") sched.date = sAdd(sched.date, 7 * dir);
  else if (sched.view === "month") { const d = sParse(sched.date); d.setDate(1); d.setMonth(d.getMonth() + dir); sched.date = sKey(d); }
  else {
    sched.date = sAdd(sched.date, dir);
    const box = document.getElementById("schedDays");
    const t = box && box.querySelector(`[data-date="${sched.date}"]`);
    if (t) { scrollBoxTo(box, t, true); return; }
  }
  renderSchedule();
}

document.querySelectorAll("#schedViews button").forEach(b => b.onclick = () => { sched.view = b.dataset.v; saveSchedPrefs(); renderSchedule(); });
document.getElementById("schedPrev").onclick = () => schedStep(-1);
document.getElementById("schedNext").onclick = () => schedStep(1);
document.getElementById("schedToday").onclick = () => { sched.date = getTodayStr(); renderSchedule(); };
document.getElementById("schedToggle").onclick = () => { sched.showAssignments = !sched.showAssignments; saveSchedPrefs(); renderSchedule(); };

// Tap an assignment on the calendar (Week or Day) to open it in place, with the same buttons as Homework
function toggleMark(id) {
  // Phone week columns are too narrow, so open that day instead
  if (sched.view === "week" && window.innerWidth < 700) {
    const el = document.querySelector(`#schedBody .smark[data-id="${CSS.escape(id)}"]`);
    const day = el && el.closest(".sday");
    openMarkId = id; if (day) openDay(day.dataset.date); return;
  }
  openMarkId = openMarkId === id ? null : id;
  confirmDeleteId = null;
  renderSchedule();
}
document.getElementById("schedBody").addEventListener("click", e => {
  const btn = e.target.closest(".sdrop .action-btn");
  if (btn) {
    e.stopPropagation();
    const id = btn.dataset.id, action = btn.dataset.action;
    const a = getAllAssignments().find(x => x.id === id);
    if (!state[id]) state[id] = {};
    const turningOn = !state[id][action];
    state[id][action] = turningOn;
    state[id].t = Date.now();
    saveState(); scheduleSync();
    if (turningOn && a && (isFinished(a) || action === "turned")) launchConfetti();
    render();
    return;
  }
  const evBtn = e.target.closest(".sdrop [data-ev]");
  if (evBtn) {
    e.stopPropagation();
    const id = evBtn.dataset.id;
    if (evBtn.dataset.ev === "edit") openEventModal(myEvents.find(x => x.id === id));
    else if (confirmDeleteId === id) { myEvents = myEvents.filter(x => x.id !== id); saveEvents(); openMarkId = confirmDeleteId = null; renderSchedule(); }
    else { confirmDeleteId = id; renderSchedule(); }
    return;
  }
  const addBtn = e.target.closest("[data-add]");
  if (addBtn) { e.stopPropagation(); openEventModal(null, addBtn.dataset.add); return; }
  if (e.target.closest(".sdrop")) { e.stopPropagation(); return; }
  const m = e.target.closest(".smark[data-id]");
  if (!m || m.closest(".smonth")) return;
  e.stopPropagation(); toggleMark(m.dataset.id);
});
document.getElementById("schedBody").addEventListener("keydown", e => {
  const m = e.target.closest(".smark[data-id]");
  if (m && !m.closest(".smonth") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleMark(m.dataset.id); }
});

// Add / edit modal for your own events
const eventModal = document.getElementById("eventModal");
let editingEventId = null, evColor = EVENT_COLORS[0];
function paintColors() {
  document.getElementById("evColors").innerHTML = EVENT_COLORS.map(c =>
    `<button type="button" style="--c:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${c === evColor}"></button>`).join("");
}
document.getElementById("evColors").addEventListener("click", e => {
  const b = e.target.closest("[data-c]"); if (!b) return; evColor = b.dataset.c; paintColors();
});
function openEventModal(ev, date) {
  editingEventId = ev ? ev.id : null;
  evColor = ev ? ev.color : EVENT_COLORS[0];
  document.getElementById("eventModalTitle").textContent = ev ? "Edit" : "Add to calendar";
  document.getElementById("evSave").textContent = ev ? "Save" : "Add";
  document.getElementById("evTitle").value = ev ? ev.title : "";
  document.getElementById("evDate").value = ev ? ev.date : (date || sched.date);
  document.getElementById("evTime").value = ev ? (ev.time || "") : "";
  document.getElementById("evNotes").value = ev ? (ev.notes || "") : "";
  document.getElementById("evError").hidden = true;
  paintColors();
  eventModal.classList.add("open");
  setTimeout(() => document.getElementById("evTitle").focus(), 30);
}
function closeEventModal() { eventModal.classList.remove("open"); }
document.getElementById("schedAdd").onclick = () => openEventModal(null);
document.getElementById("evCancel").onclick = closeEventModal;
eventModal.addEventListener("click", e => { if (e.target === eventModal) closeEventModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && eventModal.classList.contains("open")) closeEventModal(); });
document.getElementById("eventForm").addEventListener("submit", e => {
  e.preventDefault();
  const title = document.getElementById("evTitle").value.trim();
  const date = document.getElementById("evDate").value;
  const err = document.getElementById("evError");
  if (!title || !date) { err.textContent = !title ? "Give it a name first." : "Pick a date."; err.hidden = false; return; }
  const data = { title, date, time: document.getElementById("evTime").value, notes: document.getElementById("evNotes").value.trim(), color: evColor };
  if (editingEventId) { const ev = myEvents.find(x => x.id === editingEventId); if (ev) Object.assign(ev, data); }
  else { const id = "ev-" + Date.now(); myEvents.push({ id, ...data }); openMarkId = null; }
  saveEvents();
  closeEventModal();
  sched.date = date;
  renderSchedule();
});

/* ---- Notebook: one page per day ---- */
let nbPages = {};
try { nbPages = JSON.parse(localStorage.getItem("notebookPages") || "{}"); } catch(e) { nbPages = {}; }
let nbDay = getTodayStr(), nbTimer = null;
const nbText = document.getElementById("nbText");
function fitNotebook() {
  const body = document.getElementById("nbBody");
  if (document.getElementById("page-notebook").hidden) return;
  const top = body.getBoundingClientRect().top + window.scrollY;
  body.style.height = Math.max(320, window.innerHeight - top - 12) + "px";
}
function fillNbPage(page, day) {
  const d = sParse(day), today = day === getTodayStr();
  const style = document.querySelector(".nb").dataset.nb;
  const dow = d.toLocaleDateString("en-US", { weekday: "long" });
  const date = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const dayOfYear = Math.round((d - new Date(d.getFullYear(), 0, 1)) / 864e5) + 1;
  page.querySelector(".nb-dow").textContent = (today ? "Today · " : "") + dow;
  page.querySelector(".nb-date").textContent = date;
  page.querySelector(".nb-label").innerHTML = style === "comp" ? `Date <b>${date}</b>` : style === "eng" ? `Sheet <b>${String(dayOfYear).padStart(3, "0")}</b>` : "";
  page.querySelector(".nb-text").value = (nbPages[day] && nbPages[day].text) || "";
}
// A copy of a page to lay on top while it turns (copies don't carry ids or typed text by themselves)
function nbCopy(page) {
  const c = page.cloneNode(true);
  c.removeAttribute("id"); c.querySelectorAll("[id]").forEach(x => x.removeAttribute("id"));
  const t = c.querySelector(".nb-text"); t.value = page.querySelector(".nb-text").value; t.readOnly = true; t.tabIndex = -1;
  c.classList.add("nb-turn"); c.setAttribute("aria-hidden", "true");
  return c;
}
function showNbPage(dir) {
  const page = document.getElementById("nbPage");
  document.querySelectorAll("#nbBody .nb-turn").forEach(x => x.remove());
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (dir > 0 && !reduce) {
    // the old page turns away, revealing the new one underneath
    const old = nbCopy(page);
    page.after(old);
    fillNbPage(page, nbDay);
    old.classList.add("go-next");
    old.addEventListener("animationend", () => old.remove(), { once: true });
  } else if (dir < 0 && !reduce) {
    // the previous page turns back down on top of the current one
    const under = nbCopy(page); under.classList.remove("nb-turn"); under.style.zIndex = 4; under.setAttribute("aria-hidden", "true");
    page.after(under);
    fillNbPage(page, nbDay);
    const incoming = nbCopy(page);
    under.after(incoming);
    incoming.classList.add("go-prev");
    incoming.addEventListener("animationend", () => { incoming.remove(); under.remove(); }, { once: true });
  } else {
    fillNbPage(page, nbDay);
  }
  document.getElementById("nbToday").disabled = nbDay === getTodayStr();
  document.getElementById("nbSaved").textContent = nbText.value ? "Saved" : "";
  fitNotebook();
}
// Choose a notebook from the ☰ menu
const nbEl = document.querySelector(".nb"), nbMenu = document.getElementById("nbMenu"), nbMenuBtn = document.getElementById("nbMenuBtn");
function setNotebook(style) {
  nbEl.dataset.nb = style;
  document.querySelectorAll(".nb-opt").forEach(o => o.setAttribute("aria-checked", String(o.dataset.nb === style)));
  try { localStorage.setItem("notebookStyle", style); } catch(e) {}
  fillNbPage(document.getElementById("nbPage"), nbDay);
}
function toggleNbMenu(open) { nbMenu.hidden = !open; nbMenuBtn.setAttribute("aria-expanded", String(open)); }
nbMenuBtn.onclick = e => { e.stopPropagation(); toggleNbMenu(nbMenu.hidden); };
nbMenu.addEventListener("click", e => { e.stopPropagation(); const o = e.target.closest(".nb-opt"); if (o) { setNotebook(o.dataset.nb); toggleNbMenu(false); } });
document.addEventListener("click", () => { if (!nbMenu.hidden) toggleNbMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !nbMenu.hidden) { toggleNbMenu(false); nbMenuBtn.focus(); } });
function saveNbPage() {
  clearTimeout(nbTimer);
  const text = nbText.value;
  if (text.trim()) nbPages[nbDay] = { text, t: Date.now() }; else delete nbPages[nbDay];
  try { localStorage.setItem("notebookPages", JSON.stringify(nbPages)); } catch(e) {}
  document.getElementById("nbSaved").textContent = text ? "Saved" : "";
}
nbText.addEventListener("input", () => { document.getElementById("nbSaved").textContent = "Saving…"; clearTimeout(nbTimer); nbTimer = setTimeout(saveNbPage, 400); });
function flipNb(n) { saveNbPage(); nbDay = sAdd(nbDay, n); showNbPage(n); }
document.getElementById("nbPrev").onclick = () => flipNb(-1);
document.getElementById("nbNext").onclick = () => flipNb(1);
document.getElementById("nbToday").onclick = () => { const dir = getTodayStr() > nbDay ? 1 : -1; saveNbPage(); nbDay = getTodayStr(); showNbPage(dir); };
window.addEventListener("resize", fitNotebook);
window.addEventListener("hashchange", () => { if (location.hash === "#notebook") showNbPage(0); else saveNbPage(); });
{ let s = "spiral"; try { s = localStorage.getItem("notebookStyle") || "spiral"; } catch(e) {} setNotebook(["spiral","legal","comp","eng"].includes(s) ? s : "spiral"); }
showNbPage(0);

// Keep the calendar in step with the Homework page (checking things off, syncing, new syllabi)
const renderHomework = render;
render = function() { renderHomework(); renderSchedule(); };
renderSchedule();

// Boxes can only be scrolled to "today" once the page is visible
window.addEventListener("hashchange", () => { if (location.hash === "#schedule") renderSchedule(); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
